term: Clave de API
short: Un texto largo y al azar que identifica a un programa, no a una persona, cuando llama a una API. Viaja en cada petición, normalmente en la cabecera Authorization. Un buen servidor guarda solo su hash, y para quitarle el acceso basta con borrarla.
related: [api, secret, hash, header, jwt]
lesson: jwt
acronym:
  letters: API
  stands: Application Programming Interface
  translation: interfaz de programación de aplicaciones
