term: ALPN
short: La parte del handshake de TLS en la que cliente y servidor eligen qué protocolo hablarán después, por ejemplo HTTP/2 (h2) o HTTP/1.1. Se decide sin gastar ningún viaje de ida y vuelta de más.
related: [tls, handshake, http2]
lesson: http-versions
acronym:
  letters: ALPN
  stands: Application-Layer Protocol Negotiation
  translation: negociación del protocolo de la capa de aplicación
