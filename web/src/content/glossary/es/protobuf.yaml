term: Protobuf
short: 'Un formato para serializar datos en binario (bytes que no son texto), creado por Google; su nombre completo es Protocol Buffers. Los campos se describen en un esquema, un fichero .proto, y en los bytes viaja el número de cada campo en vez de su nombre. Ocupa menos que JSON, pero sin el esquema no se puede leer.'
related: [serialization, schema, json]
lesson: serialization
