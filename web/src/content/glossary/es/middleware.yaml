term: Middleware
short: Una función que un servidor ejecuta con las peticiones de las rutas donde se registra (con todas, o solo con algunas), antes del código que las contesta. Puede contestar ella misma o pasar la petición a la siguiente, y ve la respuesta cuando vuelve. Se usa para lo que toca a muchas peticiones, como anotarlas en el log, dar permiso CORS o pedir una credencial.
related: [server, request, response, cors, framework, route]
lesson: middleware
