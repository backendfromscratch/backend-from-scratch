term: Método RED (RED method)
short: 'Una receta para vigilar un servicio con solo tres métricas: cuántas peticiones llegan (Rate), cuántas fallan (Errors) y cuánto tardan (Duration). Si una de las tres se tuerce, algo le pasa a quien usa tu API.'
related: [metric, latency, percentile]
lesson: metrics
acronym:
  letters: RED
  stands: Rate, Errors, Duration
  translation: tasa, errores y duración
