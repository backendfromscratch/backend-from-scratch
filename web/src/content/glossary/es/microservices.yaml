term: Microservicios
short: Una aplicación dividida en varios programas pequeños e independientes, cada uno con su tarea y a menudo con su propia base de datos, que se hablan por la red. Cada uno se puede cambiar y escalar por separado, a cambio de más piezas que fallar y vigilar.
related: [monolith, distributed-system, api, database]
lesson: microservices
