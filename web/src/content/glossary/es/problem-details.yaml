term: Problem Details
short: 'La forma estándar del cuerpo de una respuesta de error en una API, escrita en el RFC 9457: un JSON con type (qué tipo de problema es), title (su resumen), status (el código de estado), detail (qué ha pasado esta vez) e instance (cuál de las veces). Se envía con el tipo de contenido application/problem+json.'
related: [status-code, json, mime-type, api, rfc]
lesson: api-errors
