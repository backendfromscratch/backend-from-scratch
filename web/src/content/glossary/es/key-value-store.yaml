term: Almacén clave-valor
short: Una base de datos que guarda cada dato con un nombre, su clave, y te lo devuelve cuando le das ese nombre, como un diccionario. No busca por condiciones ni cruza datos, y a cambio es muy rápida. Redis es el más conocido, y se usa mucho como caché.
related: [nosql, cache, database]
lesson: nosql
