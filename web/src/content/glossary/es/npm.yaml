term: npm
short: El gestor de paquetes de Node.js, que viene instalado con él. Es a la vez un comando, que descarga paquetes en tu proyecto, y un catálogo público en internet en el que cualquiera puede publicarlos. Aunque se suele leer como «Node Package Manager», oficialmente no es una sigla.
related: [package, package-manager, nodejs]
lesson: nodejs
