term: SSRF
short: Un ataque en el que alguien da a un servidor una URL para que la visite, y el servidor llega con su petición a sitios a los que solo él llega, como su propia base de datos, la red interna o las credenciales que la nube le da. Se frena comprobando a qué dirección IP apunta la URL antes de conectarse.
related: [server, url, private-ip, localhost, request, ip-address]
lesson: csrf-ssrf
acronym:
  letters: SSRF
  stands: Server-Side Request Forgery
  translation: falsificación de peticiones desde el servidor
