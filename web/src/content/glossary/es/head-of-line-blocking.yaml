term: Bloqueo de cabeza de línea
short: Cuando lo primero de una cola se atasca y retiene todo lo que viene detrás, aunque ya esté listo. En HTTP/1.1 lo causa una respuesta lenta; en TCP, un segmento perdido. En inglés, head-of-line blocking.
related: [tcp, http2, quic, segment]
lesson: http-versions
