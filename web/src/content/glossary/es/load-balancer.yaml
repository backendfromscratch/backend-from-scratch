term: Balanceador de carga
short: Lo que reparte las peticiones entre varias copias de un mismo programa, para que ninguna cargue con todo y para que, si una cae, las demás sigan atendiendo. Puede ser un programa, como nginx con su bloque upstream, o un servicio de un proveedor de la nube.
related: [reverse-proxy, server, healthcheck, horizontal-scaling]
lesson: reverse-proxy
