term: Método HTTP
short: La palabra con la que empieza cada petición HTTP y que dice qué quiere hacer el cliente con lo que pide. GET es leer, POST enviar datos, PUT sustituir, PATCH cambiar una parte y DELETE borrar.
related: [http, request, safe-method, idempotent]
lesson: http-methods
acronym:
  letters: HTTP
  stands: HyperText Transfer Protocol
  translation: protocolo de transferencia de hipertexto
