term: Traza (stack trace)
short: La lista de funciones por las que pasaba un programa cuando saltó un error, de la más reciente a la más antigua, con el fichero, la línea y la columna de cada una. Dice dónde ha fallado, y por eso va al log y nunca a quien hizo la petición.
related: [exception, function, log]
lesson: errors-logging
