term: REPL
short: Un modo de trabajar con un lenguaje en el que escribes una línea de código, se ejecuta y ves el resultado al momento, sin crear ningún fichero. En Node.js se abre escribiendo node, sin nada más, en la terminal.
related: [nodejs, terminal]
lesson: nodejs
acronym:
  letters: REPL
  stands: Read-Eval-Print Loop
  translation: bucle de leer, evaluar e imprimir
