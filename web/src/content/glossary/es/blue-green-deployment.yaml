term: Despliegue blue-green
short: 'Una forma de publicar con dos entornos completos: el azul, con la versión actual que atiende a los usuarios, y el verde, con la nueva. Cuando el verde está probado, el tráfico se pasa de uno a otro de golpe. Si algo falla, se vuelve al azul.'
related: [zero-downtime-deployment, rollback, deployment, load-balancer]
lesson: zero-downtime
