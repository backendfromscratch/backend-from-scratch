term: Fuerza bruta
short: Adivinar algo secreto, como una contraseña, probando posibilidades una detrás de otra hasta acertar, normalmente con un programa. Se frena haciendo caro cada intento, con un hash lento, y limitando cuántos se permiten, con rate limiting.
related: [rate-limiting, password-hashing, hash, secret]
lesson: rate-limiting
