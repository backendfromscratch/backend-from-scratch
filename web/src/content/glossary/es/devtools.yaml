term: DevTools
short: Las herramientas para desarrolladores que traen los navegadores, como Chrome o Firefox, y que se abren con F12. Su pestaña Red enseña cada petición de la página, con su respuesta y sus cabeceras; la Consola, los errores de la página, y Aplicación (Almacenamiento, en Firefox), lo que la web guarda en tu navegador, como las cookies.
related: [request, response, header, status-code, cookie]
lesson: phase-2
