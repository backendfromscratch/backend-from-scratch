term: Outbox transaccional (transactional outbox)
short: 'Un truco para no perder avisos: el pedido y el aviso que hay que enviar se guardan en la misma transacción de la base de datos, en una tabla de salida, y otro programa los envía después. O se guardan los dos, o ninguno.'
related: [transaction, message-queue, event-driven-architecture, database]
lesson: events
