term: URL
short: 'La dirección de algo en la web, como https://tienda.example/productos?orden=precio. Dice con qué protocolo pedirlo (https), a qué servidor (tienda.example) y qué página o fichero dentro de él (/productos), y puede llevar datos extra en la query string.'
related: [http, query-string, server]
lesson: http-messages
acronym:
  letters: URL
  stands: Uniform Resource Locator
  translation: localizador uniforme de recursos
