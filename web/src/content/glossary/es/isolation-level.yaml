term: Nivel de aislamiento
short: Cuánto se protege una transacción de las que van a la vez que ella. PostgreSQL usa por defecto Read Committed, donde cada orden ve lo ya confirmado; con Serializable, el resultado es el mismo que si fueran una detrás de otra, a cambio de tener que repetir algunas.
related: [transaction, acid, race-condition]
lesson: transactions
