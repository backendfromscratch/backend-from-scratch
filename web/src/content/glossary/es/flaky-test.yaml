term: Prueba intermitente (flaky test)
short: Una prueba que a veces pasa y a veces falla sin que el código haya cambiado, casi siempre por depender del reloj, del orden de ejecución o de algo externo. Es peligrosa porque enseña a ignorar los fallos.
related: [race-condition, continuous-integration, unit-test]
lesson: test-types
