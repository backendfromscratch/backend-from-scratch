term: Clave de idempotencia (Idempotency-Key)
short: Un valor único que el cliente envía en la cabecera Idempotency-Key con una operación, como crear un pedido. Si repite la petición con la misma clave, el servidor devuelve la primera respuesta en vez de hacerla otra vez.
related: [idempotent, header, http-method, webhook]
lesson: webhooks
