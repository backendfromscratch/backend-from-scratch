term: Query string
short: 'La parte de una URL que va después de «?»: datos en pares nombre=valor separados por «&», como q=taza&orden=precio. Viaja al servidor pegada a la ruta, y se usa para buscar, filtrar o elegir una página de resultados. En español, a veces, «cadena de consulta».'
related: [url, request, request-body]
lesson: http-messages
