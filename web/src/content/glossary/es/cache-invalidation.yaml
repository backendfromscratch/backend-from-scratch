term: Invalidación de caché
short: Conseguir que las copias guardadas de algo que ha cambiado dejen de usarse. Es difícil porque el servidor no puede avisar a los navegadores que ya tienen una copia; solo contesta cuando le preguntan. Por eso se usan caducidades cortas o se cambia el nombre del fichero.
related: [cache, cdn, etag]
lesson: http-caching
