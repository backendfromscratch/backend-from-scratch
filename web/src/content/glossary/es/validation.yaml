term: Validación
short: 'Comprobar, cada vez que llegan, que los datos que envía el cliente son como se esperaba antes de usarlos: que no falte ningún campo, que un número sea un número y que esté dentro de lo permitido. Si algo no cumple, el servidor responde con un error y no sigue.'
related: [schema, client, request-body, status-code]
lesson: validation
