term: PaaS
short: 'Plataforma como servicio (en inglés, Platform as a Service): le das tu código o tu imagen de Docker, y la plataforma lo construye, lo ejecuta y le da un nombre con HTTPS. El servidor y su sistema operativo los administra ella, y tú no entras en ellos.'
related: [iaas, serverless, saas, deployment]
lesson: cloud-models
