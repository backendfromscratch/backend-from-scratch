term: IaaS
short: 'Infraestructura como servicio (en inglés, Infrastructure as a Service): alquilas servidores virtuales, discos y redes, y lo de dentro lo administras tú, del sistema operativo a tu aplicación. Un VPS y Amazon EC2 son IaaS.'
related: [vps, paas, serverless, virtual-machine]
lesson: cloud-models
