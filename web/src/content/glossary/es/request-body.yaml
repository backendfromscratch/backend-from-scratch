term: Cuerpo (de una petición o respuesta)
short: Los datos que lleva un mensaje HTTP después de la línea vacía que cierra las cabeceras, como los campos de un formulario, un JSON o una imagen. La cabecera Content-Type dice en qué formato está, y Content-Length, cuántos bytes ocupa. En inglés, body.
related: [header, mime-type, request, response]
lesson: http-messages
