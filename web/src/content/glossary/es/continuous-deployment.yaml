term: Despliegue continuo (CD)
short: Que cada cambio que pasa las comprobaciones de la integración continua llegue solo a producción, sin que nadie lo despliegue a mano. Si el último paso es un botón que pulsa una persona, se llama entrega continua (continuous delivery), con las mismas siglas.
related: [continuous-integration, deployment, rollback]
lesson: ci-cd
acronym:
  letters: CD
  stands: Continuous Deployment
  translation: despliegue continuo
