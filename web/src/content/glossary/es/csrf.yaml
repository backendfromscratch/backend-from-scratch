term: CSRF
short: Un ataque en el que una página hace que tu navegador envíe una petición a un sitio donde tienes la sesión iniciada, con tus cookies, para hacer algo en tu nombre, como cambiar tu correo o comprar. CORS no lo impide, porque muchas peticiones llegan al servidor aunque la página no pueda leer la respuesta.
related: [cors, same-origin-policy, request, cookie, session]
lesson: cors
acronym:
  letters: CSRF
  stands: Cross-Site Request Forgery
  translation: falsificación de peticiones entre sitios
