term: Percentil
short: Un número que dice qué parte de las medidas queda por debajo de él. Si el percentil 99 de las respuestas es 400 ms, el 99 % de las peticiones tardó 400 ms o menos y solo una de cada cien tardó más. Enseña los casos lentos que una media esconde.
related: [latency, load-test]
lesson: phase-9
