term: Replicación
short: 'Mantener copias de los mismos datos en varias máquinas. Una máquina recibe los cambios y los envía a las demás. Sirve para repartir las lecturas y para no perder los datos si una cae. No sustituye a una copia de seguridad: un borrado por error también se replica.'
related: [distributed-system, eventual-consistency, database, backup]
lesson: cap
