term: Observabilidad (observability)
short: 'La capacidad de saber qué está pasando dentro de un programa en producción mirando solo lo que emite hacia fuera: logs, métricas y trazas. Si puedes preguntarle «¿por qué esta petición tardó 3 segundos?» sin tocar el código, tienes observabilidad.'
related: [log, metric, trace]
