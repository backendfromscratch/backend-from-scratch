term: SQL
short: El lenguaje con el que se le pide a una base de datos que lea, añada, cambie o borre los datos de sus tablas. Se escribe casi como una frase en inglés, como SELECT nombre FROM productos, y dice qué datos quieres, no cómo encontrarlos.
related: [database, table, query]
lesson: sql
acronym:
  letters: SQL
  stands: Structured Query Language
  translation: lenguaje de consulta estructurado
