term: Publicar un puerto
short: Unir un puerto de tu ordenador con uno de un contenedor, con la opción -p de docker run, para que lo que llega al primero entre en el segundo. Sin una IP delante, Docker abre el puerto en todas las direcciones de tu ordenador, y llega cualquiera de tu red; con 127.0.0.1 delante, solo tu ordenador.
related: [port, container, localhost]
lesson: networks
