term: REST
short: 'Una forma de diseñar APIs sobre HTTP: cada cosa es un recurso con su propia URL, y con ella se trabaja con los métodos de siempre (GET, POST, PATCH, DELETE) y los códigos de estado. La describió Roy Fielding en el año 2000; hoy se llama así a casi cualquier API de JSON organizada de esta manera.'
related: [api, resource, endpoint, stateless, http-method]
lesson: rest
acronym:
  letters: REST
  stands: Representational State Transfer
  translation: transferencia de estado representacional
