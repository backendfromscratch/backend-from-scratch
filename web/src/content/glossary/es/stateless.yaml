term: Sin estado (stateless)
short: Se dice de un servidor que no recuerda nada de una petición a la siguiente. Cada petición lleva todo lo que hace falta para entenderla, como quién eres o qué página quieres, y por eso puede atenderla cualquier copia del servidor. Lo que sí guarda son los datos, como los pedidos.
related: [rest, request, server, session]
lesson: rest
