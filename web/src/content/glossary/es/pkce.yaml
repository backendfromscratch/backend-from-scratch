term: PKCE
short: Una protección del inicio de sesión con OAuth. La web inventa un secreto al azar y, al empezar, solo manda su hash; para cambiar el código que recibe a la vuelta tiene que enseñar el secreto, así que un código robado no le sirve a nadie más.
related: [oauth, openid-connect, hash]
lesson: oauth
acronym:
  letters: PKCE
  stands: Proof Key for Code Exchange
  translation: clave de prueba para el intercambio del código
