term: Búsqueda semántica
short: 'Buscar por lo que significa la pregunta, no por sus palabras: se convierten en embeddings la pregunta y lo que se busca, y salen los más cercanos. Siempre devuelve algo, aunque no sirva, así que cada resultado lleva su distancia.'
related: [embedding, full-text-search, cosine-distance]
lesson: embeddings
