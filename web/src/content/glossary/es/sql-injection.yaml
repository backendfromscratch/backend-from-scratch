term: Inyección SQL
short: Un ataque que envía un valor preparado para que, pegado dentro del texto de una consulta, cambie lo que hace, como devolver todas las filas o borrar una tabla. Se evita enviando los valores aparte, como parámetros, y nunca pegándolos en el SQL.
related: [sql, query, validation]
lesson: node-postgres
acronym:
  letters: SQL
  stands: Structured Query Language
  translation: lenguaje de consulta estructurado
