term: JSONB (en PostgreSQL)
short: Un tipo de columna de PostgreSQL que guarda un JSON entero en cada fila, ya descompuesto para poder buscar dentro de él. Sirve para los datos que no tienen siempre la misma forma, sin salir de la base de datos de siempre.
related: [json, database, nosql]
lesson: nosql
acronym:
  letters: JSONB
  stands: JavaScript Object Notation Binary
  translation: notación de objetos de JavaScript en binario
