term: jsonb (en PostgreSQL)
short: Un tipo de columna de PostgreSQL que guarda un JSON entero en cada fila, ya descompuesto en un formato binario para poder buscar dentro de él. Sirve para los datos que no tienen siempre la misma forma, sin salir de la base de datos de siempre. Se suele escribir JSONB.
related: [json, database, nosql]
lesson: nosql
