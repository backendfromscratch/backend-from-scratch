term: JSON-RPC
short: 'Una forma de llamar a una función de otro programa con un mensaje JSON: el nombre de la función (method), sus argumentos (params) y un id, que la respuesta repite. Un mensaje sin id es una notificación y no espera respuesta. RPC viene del inglés remote procedure call, «llamada a un procedimiento remoto».'
related: [json, grpc, protocol]
lesson: mcp
acronym:
  letters: JSON
  stands: JavaScript Object Notation
  translation: notación de objetos de JavaScript
