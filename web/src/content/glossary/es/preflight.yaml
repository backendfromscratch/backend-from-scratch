term: Petición previa (preflight)
short: La consulta que el navegador envía a otro origen antes de una petición que no es sencilla (por ejemplo, una que borra datos o lleva cabeceras propias), para preguntar al servidor si la acepta. Usa el método OPTIONS, y si el servidor no la autoriza, la petición de verdad no se envía.
related: [cors, origin, request, http-method]
lesson: cors
