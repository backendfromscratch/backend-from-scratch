term: Despliegue sin caída
short: 'Publicar una versión nueva sin que los usuarios noten ningún corte: mientras las copias se actualizan, una cada vez, las demás siguen atendiendo. Las peticiones que ya estaban en marcha terminan antes de apagar nada.'
related: [deployment, graceful-shutdown, blue-green-deployment, load-balancer]
lesson: zero-downtime
