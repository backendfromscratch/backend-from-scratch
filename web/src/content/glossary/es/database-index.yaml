term: Índice (base de datos)
short: Una lista aparte, ordenada, con los valores de una o varias columnas de una tabla y el sitio de cada fila. Con ella, la base de datos encuentra unas pocas filas sin leer la tabla entera. A cambio, ocupa disco y cada escritura tiene que ponerla al día. En inglés, index.
related: [b-tree, query-plan, table, primary-key]
lesson: indexes
