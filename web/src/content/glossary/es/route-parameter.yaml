term: Parámetro de ruta
short: 'Un trozo variable de una ruta, marcado con dos puntos: en /productos/:id, el :id. La ruta acepta ahí cualquier valor (/productos/2, /productos/7) y se lo da a tu código, siempre como texto. Dice qué recurso pides; para filtrar o buscar en una lista se usa la query string.'
related: [route, query-string, url]
lesson: frameworks
