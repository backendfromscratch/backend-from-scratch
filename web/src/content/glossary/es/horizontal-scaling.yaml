term: Escalado horizontal
short: Aguantar más usuarios añadiendo más copias del programa, cada una en su máquina o su proceso, con un balanceador de carga que reparte el trabajo. Su tope está mucho más lejos que el de comprar una máquina mayor, pero exige que cada copia no recuerde nada entre una petición y la siguiente.
related: [vertical-scaling, load-balancer, stateless]
lesson: scaling
