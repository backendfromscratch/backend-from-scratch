term: Árbol B
short: La forma en que una base de datos guarda casi todos sus índices. Las entradas van en orden abajo, en las hojas, y encima unos pocos bloques dicen qué hoja mirar. Cada nivel multiplica por cientos lo que cabe, así que cualquier valor está a tres o cuatro pasos, aunque haya millones de filas. En inglés, B-tree.
related: [database-index, query-plan]
lesson: indexes
