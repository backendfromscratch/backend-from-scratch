term: Recurso (en una API)
acronym:
  letters: API
  stands: Application Programming Interface
  translation: interfaz de programación de aplicaciones
short: Cada cosa de la que habla una API y que tiene su propia URL, como un producto (/productos/2) o la lista de pedidos (/pedidos). Se nombra con un sustantivo, y lo que haces con él lo dice el método HTTP.
related: [rest, endpoint, url, http-method]
lesson: rest
