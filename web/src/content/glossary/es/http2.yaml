term: HTTP/2
short: La versión de HTTP de 2015. Dice lo mismo que HTTP/1.1, pero troceado y en un formato para máquinas, no en texto, y lleva muchas peticiones a la vez por una sola conexión TCP. Los navegadores solo la usan con HTTPS.
related: [http, multiplexing, alpn, http3]
lesson: http-versions
acronym:
  letters: HTTP
  stands: HyperText Transfer Protocol
  translation: protocolo de transferencia de hipertexto
