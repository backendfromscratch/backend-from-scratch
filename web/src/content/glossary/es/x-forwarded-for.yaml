term: X-Forwarded-For
short: La cabecera en la que un proxy le dice al programa de detrás desde qué IP llegó la petición, porque ese programa solo ve la del proxy. Cada proxy añade una dirección al final de la lista. Cualquiera puede escribirla, así que solo es de fiar la entrada que añadió tu propio proxy.
related: [header, reverse-proxy, ip-address]
lesson: reverse-proxy
