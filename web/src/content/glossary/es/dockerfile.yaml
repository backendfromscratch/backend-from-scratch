term: Dockerfile
short: El fichero de texto con la receta de una imagen de Docker, una instrucción por línea. Dice de qué imagen se parte, qué ficheros se copian, qué órdenes se ejecutan al construirla y qué programa arranca cada contenedor. docker build lo lee de arriba abajo y cada paso que cambia ficheros añade una capa.
related: [image, image-layer, build-cache, container]
lesson: dockerfile
