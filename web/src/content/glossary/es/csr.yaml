term: CSR
short: La petición que se manda a una autoridad certificadora para que firme un certificado. Lleva la clave pública del servidor y los nombres que debe cubrir, firmada con su clave privada, que nunca sale del servidor.
related: [certificate, certificate-authority, public-key, private-key]
lesson: domain-https
acronym:
  letters: CSR
  stands: Certificate Signing Request
  translation: petición de firma de certificado
