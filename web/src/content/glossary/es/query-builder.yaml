term: Query builder (constructor de consultas)
short: Un paquete que deja escribir una consulta SQL con funciones del lenguaje del programa, una por cada parte (select, from, where), en lugar de en un texto. El editor comprueba los nombres de las tablas y las columnas, y los valores viajan aparte, como parámetros.
related: [query, sql, orm, sql-injection]
lesson: orm
