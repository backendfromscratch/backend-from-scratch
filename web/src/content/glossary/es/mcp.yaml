term: MCP
short: 'Un protocolo abierto para que un agente de IA descubra las herramientas de un servidor y las use, sea cual sea el agente y sea cual sea el servidor. Por debajo son mensajes JSON-RPC: tools/list para ver la lista, tools/call para usar una. Lo publicó Anthropic en 2024.'
related: [json-rpc, protocol, api-key, server]
lesson: mcp
acronym:
  letters: MCP
  stands: Model Context Protocol
  translation: protocolo de contexto para modelos
