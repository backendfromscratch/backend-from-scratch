term: Cursor (paginación)
short: 'Un texto que marca hasta dónde has leído de una lista por páginas, para pedir «los que van después de este». Lo escribe el servidor, y el cliente solo lo devuelve tal cual. A diferencia de «sáltate los 20 primeros», no se equivoca si la lista cambia entre una página y la siguiente.'
related: [pagination, query-string]
lesson: pagination
