term: HTTP/3
short: La versión de HTTP de 2022. Hace lo mismo que HTTP/2, pero sobre QUIC, por UDP, en lugar de TCP. Así, un trozo perdido solo retrasa su propia petición, y la conexión sobrevive a un cambio de red.
related: [http, quic, http2, udp]
lesson: http-versions
acronym:
  letters: HTTP
  stands: HyperText Transfer Protocol
  translation: protocolo de transferencia de hipertexto
