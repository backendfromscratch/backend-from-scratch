term: BOLA
short: El fallo de una API que deja ver o cambiar un dato de otra persona, como un pedido o una factura, con solo cambiar su número en la URL. La API comprueba quién eres, pero no si ese dato es tuyo. Es muy común: encabeza la lista de OWASP de fallos de las APIs.
related: [authorization, api, url, route-parameter, owasp]
lesson: authorization
acronym:
  letters: BOLA
  stands: Broken Object Level Authorization
  translation: autorización rota a nivel de objeto
