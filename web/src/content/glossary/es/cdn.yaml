term: CDN
short: Una red de servidores repartidos por el mundo que sirven una web desde el más cercano a cada usuario. Así el viaje de ida y vuelta es corto. example.com está detrás de la de Cloudflare.
related: [latency, rtt, cache]
acronym:
  letters: CDN
  stands: Content Delivery Network
  translation: red de distribución de contenidos
