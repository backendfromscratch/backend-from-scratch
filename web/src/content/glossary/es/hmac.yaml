term: HMAC
short: Una firma que se calcula con un hash a partir de un mensaje y un secreto que conocen las dos partes. Quien tiene el secreto puede comprobar que el mensaje viene de la otra parte y que nadie lo ha cambiado; quien no lo tiene, no puede fabricarla.
related: [hash, secret, webhook, digital-signature]
lesson: webhooks
acronym:
  letters: HMAC
  stands: Hash-based Message Authentication Code
  translation: código de autenticación de mensajes basado en hash
