term: Capa (de una imagen)
short: Cada una de las piezas de solo lectura que forman una imagen de Docker. Guarda los ficheros que añadió, cambió o borró un paso de la receta de la imagen, y las capas se apilan para formar los ficheros del contenedor. Se nombra por la huella de su contenido, así que varias imágenes comparten las capas iguales y se guardan una sola vez.
related: [image, build-cache, container]
lesson: layers
