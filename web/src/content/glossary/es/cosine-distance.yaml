term: Distancia del coseno
short: 'Cuánto se separan dos vectores por el ángulo que forman, sin mirar lo largos que son: 0 si apuntan igual, 1 si no tienen nada que ver y 2 si apuntan en sentidos contrarios. Entre dos embeddings, dice cuánto se parecen dos textos. En pgvector es el operador <=>.'
