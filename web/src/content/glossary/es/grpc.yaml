term: gRPC
short: Una forma de comunicar dos programas en la que uno llama a una función del otro como si estuviera en su propio código. Los datos viajan en Protobuf sobre HTTP/2, y un fichero .proto describe las funciones y sus datos. Se usa sobre todo entre los servicios de una misma empresa. Lo creó Google.
related: [protobuf, http2, api]
lesson: api-alternatives
