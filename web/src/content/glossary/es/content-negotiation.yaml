term: Negociación de contenido
short: 'Cuando el cliente dice en sus cabeceras qué prefiere (un idioma, un formato, una compresión) y el servidor elige, entre las versiones que tiene de una misma dirección, la que mejor encaja. La cabecera Vary avisa a las cachés de que la respuesta depende de esas cabeceras.'
related: [header, compression, cache]
lesson: http-headers
