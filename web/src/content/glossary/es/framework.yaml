term: Framework
short: Código ya escrito que resuelve lo que repite casi cualquier programa de un tipo, como un servidor (leer cada petición, decidir qué ruta la atiende y responder), y que llama a tus funciones cuando llega el momento. Tú escribes solo lo propio de tu aplicación. Hono, Express y Fastify son frameworks para servidores.
related: [server, route, api]
lesson: frameworks
