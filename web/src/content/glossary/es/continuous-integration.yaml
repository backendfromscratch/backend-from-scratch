term: Integración continua (CI)
short: Juntar los cambios en la rama principal a menudo, con un programa que comprueba cada uno antes de aceptarlo (instala, revisa los tipos, pasa los tests). Si algo se rompe, se sabe en minutos y se sabe con qué cambio.
related: [continuous-deployment, github-actions, commit, branch]
lesson: ci-cd
acronym:
  letters: CI
  stands: Continuous Integration
  translation: integración continua
