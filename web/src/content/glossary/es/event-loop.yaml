term: Event loop
short: 'El bucle con el que Node.js atiende muchas cosas a la vez con un solo hilo (en español, «bucle de eventos»). Ejecuta un trozo de código hasta el final, mira qué está listo en su cola (una petición que ha llegado, un temporizador que ha vencido) y pasa a lo siguiente. Si un trozo tarda mucho, todo lo demás espera.'
related: [thread, blocking, process]
lesson: event-loop
