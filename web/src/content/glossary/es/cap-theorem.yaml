term: Teorema CAP
short: 'Una regla sobre sistemas distribuidos: cuando la red se parte, el sistema tiene que elegir entre seguir contestando, aunque algunas respuestas sean antiguas (disponibilidad), o negarse a contestar hasta tener el dato correcto (consistencia). Con la red sana, no hay que elegir.'
related: [distributed-system, network-partition, eventual-consistency, replication]
lesson: cap
acronym:
  letters: CAP
  stands: Consistency, Availability, Partition tolerance
  translation: consistencia, disponibilidad y tolerancia a particiones
