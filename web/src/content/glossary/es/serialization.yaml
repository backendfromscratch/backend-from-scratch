term: Serialización
short: 'Convertir unos datos que viven en la memoria de un programa en bytes que se pueden enviar por la red o guardar en un fichero: texto JSON, por ejemplo, o un formato binario como Protobuf. Al otro lado, deserializar los convierte otra vez en datos. En inglés, serialization.'
related: [json, protobuf, schema]
lesson: serialization
