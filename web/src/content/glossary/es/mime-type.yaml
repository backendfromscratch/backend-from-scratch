term: Tipo MIME
short: 'La etiqueta que dice qué clase de datos lleva un mensaje, con la forma tipo/subtipo: text/html es una página web, application/json son datos en JSON e image/png, una imagen PNG. En HTTP va en la cabecera Content-Type. También se llama media type, «tipo de medio».'
related: [header, request-body, json]
lesson: http-messages
acronym:
  letters: MIME
  stands: Multipurpose Internet Mail Extensions
  translation: extensiones multipropósito del correo de internet
