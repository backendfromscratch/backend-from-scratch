term: Versionado de una API
acronym:
  letters: API
  stands: Application Programming Interface
  translation: interfaz de programación de aplicaciones
short: 'Dar un número o un nombre a cada forma que tiene una API, para poder cambiarla sin romper a quien usa la anterior: /v1/ y /v2/ conviven un tiempo y cada cliente elige la suya. En inglés, versioning.'
related: [api, breaking-change, deprecation]
lesson: versioning
