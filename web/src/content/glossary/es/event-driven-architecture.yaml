term: Arquitectura orientada a eventos
short: Una forma de organizar un sistema en la que cada parte avisa de lo que ha pasado («pedido creado») y otras partes reaccionan por su cuenta. Quien avisa no sabe quién escucha, así que se pueden añadir reacciones sin tocarla.
related: [message-queue, pub-sub, webhook, sse]
lesson: events
