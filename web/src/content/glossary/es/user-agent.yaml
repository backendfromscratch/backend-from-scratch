term: User-Agent
short: 'La cabecera con la que el cliente dice qué programa es: «curl/8.7.1», o el nombre y la versión del navegador y del sistema. Al servidor le sirve para estadísticas o para adaptar una respuesta, pero no para fiarse: cualquiera puede escribir en ella lo que quiera.'
related: [header, client, request]
lesson: http-headers
