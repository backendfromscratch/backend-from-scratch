term: Expulsión de caché (eviction)
short: Borrar datos de una caché que se ha llenado para hacer sitio a otros. Se elige qué sale con una regla, como quitar lo que lleva más tiempo sin usarse. A diferencia de la caducidad (TTL), que ocurre por tiempo, la expulsión ocurre solo porque falta sitio.
related: [cache, cache-invalidation, ttl]
lesson: cache
