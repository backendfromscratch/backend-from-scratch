term: Inyección de prompt
short: 'Colar instrucciones en el texto que lee un modelo (lo que escribe un cliente, una página, el resultado de una herramienta) para que haga lo que no debe. La defensa no está en el prompt: está en que el código no le dé al modelo más permisos que a quien lo usa.'
related: [sql-injection, authorization, llm-prompt]
lesson: tool-use
