term: Avalancha de caché (cache stampede)
short: Lo que pasa cuando una respuesta muy pedida caduca y, en ese instante, muchas peticiones la piden a la vez a la base de datos porque ninguna la encuentra en la caché. La base de datos recibe de golpe un trabajo que la caché le ahorraba.
related: [cache, cache-aside, ttl, database]
lesson: cache
