term: Etiqueta (de una imagen)
short: El nombre de versión que va detrás de los dos puntos en el nombre de una imagen de Docker, como 26-slim en node:26-slim (en inglés, tag). Si no escribes ninguna, Docker usa latest. Quien puede escribir en el registro puede mover una etiqueta a otra imagen cuando quiera, por eso no garantiza qué imagen recibes.
related: [image-digest, image, registry]
lesson: registry
