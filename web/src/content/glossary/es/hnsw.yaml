term: HNSW
short: 'Un índice para encontrar los vectores más cercanos a uno dado sin mirar toda la tabla: un grafo por pisos en el que la búsqueda salta de vecino en vecino hasta llegar cerca. Es aproximado: mucho más rápido que leer la tabla entera, pero no garantiza encontrar los más cercanos de verdad.'
related: [database-index, b-tree, embedding]
lesson: embeddings
acronym:
  letters: HNSW
  stands: Hierarchical Navigable Small World
  translation: mundo pequeño navegable por pisos
