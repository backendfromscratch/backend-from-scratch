term: JSON Schema
short: 'Un formato, escrito en JSON, para describir cómo debe ser un dato JSON: qué campos tiene, de qué tipo es cada uno y cuáles son obligatorios. Un programa puede usarlo para validar datos de forma automática.'
related: [json, validation, openapi]
acronym:
  letters: JSON
  stands: JavaScript Object Notation
  translation: notación de objetos de JavaScript
