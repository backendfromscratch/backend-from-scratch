term: ACID
short: Las cuatro garantías de una transacción. Se hace entera o nada (atomicidad), deja los datos cumpliendo las reglas de sus tablas (consistencia), no ve a medias lo que hacen las demás (aislamiento) y, una vez confirmada, sobrevive a un apagón (durabilidad).
related: [transaction, isolation-level, database]
lesson: transactions
acronym:
  letters: ACID
  stands: Atomicity, Consistency, Isolation, Durability
  translation: atomicidad, consistencia, aislamiento y durabilidad
