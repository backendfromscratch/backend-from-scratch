term: ACME
short: El protocolo con el que un programa de tu servidor, como certbot, pide un certificado a una autoridad como Let's Encrypt, demuestra que controla el dominio (por ejemplo, publicando un fichero en el puerto 80) y lo renueva sin que intervengas.
related: [lets-encrypt, certificate-authority, protocol]
lesson: domain-https
acronym:
  letters: ACME
  stands: Automatic Certificate Management Environment
  translation: entorno de gestión automática de certificados
