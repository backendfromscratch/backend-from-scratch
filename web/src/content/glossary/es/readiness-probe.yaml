term: Sonda de disponibilidad (readiness probe)
short: Una comprobación periódica que responde a «¿puede este programa atender peticiones ahora?». Mira lo que necesita para trabajar, como la base de datos. Si falla, se le deja de enviar tráfico, pero no se reinicia.
related: [healthcheck, liveness-probe, load-balancer]
lesson: alerts
