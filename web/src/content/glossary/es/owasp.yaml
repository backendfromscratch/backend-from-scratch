term: OWASP
short: Una comunidad abierta, sostenida por una fundación sin ánimo de lucro, que publica gratis guías y herramientas para hacer aplicaciones web seguras. Su documento más conocido es el OWASP Top 10, la lista de los diez riesgos más graves de las aplicaciones web.
related: [authorization, sql-injection, security-headers]
lesson: owasp
acronym:
  letters: OWASP
  stands: Open Worldwide Application Security Project
  translation: proyecto abierto y mundial de seguridad de aplicaciones
