term: HSTS
short: 'La cabecera Strict-Transport-Security, con la que una web le pide al navegador que, durante el tiempo que indica, se conecte a ella solo por HTTPS, aunque escribas http:// o sigas un enlace antiguo. El navegador solo la tiene en cuenta si le llega por HTTPS.'
related: [https, security-headers, tls]
lesson: http-headers
acronym:
  letters: HSTS
  stands: HTTP Strict Transport Security
  translation: seguridad de transporte estricta para HTTP
