term: TTL (en DNS)
short: Los segundos que se puede guardar una respuesta DNS en una caché antes de volver a preguntar. No tiene que ver con el TTL de los paquetes IP, que cuenta por cuántos routers pueden pasar.
related: [dns-record, cache, resolver]
acronym:
  letters: TTL
  stands: time to live
  translation: tiempo de vida
