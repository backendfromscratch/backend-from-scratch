term: Embedding
short: 'Un texto convertido en una lista de números, un vector, por un modelo entrenado para que los textos que significan lo mismo den vectores cercanos. Sirve para buscar por el significado: «algo para el frío» queda cerca de una bufanda aunque no compartan ninguna palabra.'
related: [cosine-distance, semantic-search, vector-database]
lesson: embeddings
