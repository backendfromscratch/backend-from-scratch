term: Presupuesto de errores (error budget)
short: 'Lo que un SLO te deja fallar: con un 99,5 % mensual, el 0,5 % de las peticiones. Mientras te quede presupuesto puedes arriesgar y desplegar; si se agota, toca dejar las novedades y arreglar la fiabilidad.'
related: [slo, sli, deployment]
lesson: alerts
