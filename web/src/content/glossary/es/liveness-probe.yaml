term: Sonda de vida (liveness probe)
short: 'Una comprobación periódica que responde a «¿sigue vivo este programa?». Si falla varias veces, quien lo vigila lo reinicia. Debe mirar solo al propio programa: si mirase la base de datos, una caída de esta reiniciaría todo sin arreglar nada.'
related: [healthcheck, readiness-probe, restart-policy]
lesson: alerts
