term: Healthcheck
short: Una orden que Docker ejecuta cada pocos segundos dentro de un contenedor para saber si su programa funciona de verdad, no solo si está en marcha. Si termina bien, el contenedor está sano (healthy); tras varios fallos seguidos, no (unhealthy). Compose lo usa para esperar a un servicio antes de arrancar los que dependen de él.
related: [container, docker-compose, process]
lesson: small-images
