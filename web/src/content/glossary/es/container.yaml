term: Contenedor
short: Un programa que se ejecuta aislado y lleva dentro todo lo que necesita, con sus propios ficheros, su red y sus procesos. No es una máquina virtual, porque no arranca un sistema entero, sino que comparte el núcleo de Linux de la máquina donde corre. Por eso arranca en menos de un segundo.
related: [docker, virtual-machine, process]
lesson: phase-7
