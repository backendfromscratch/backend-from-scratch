term: Prueba unitaria (unit test)
short: Una prueba automática que comprueba una sola pieza pequeña de código, casi siempre una función, sin base de datos ni red. Le das unos datos, miras lo que devuelve y compruebas que es lo esperado. Se ejecuta en milisegundos.
related: [function, integration-test, assertion]
lesson: test-types
