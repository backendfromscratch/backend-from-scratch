term: Vuelta atrás de un despliegue (rollback)
short: Volver a poner en marcha la versión anterior de un programa cuando la nueva falla. Devuelve el código, no los datos ni el esquema de la base de datos, porque lo que cambiaron las migraciones de la versión nueva sigue cambiado. No es el ROLLBACK de una transacción, que sí deshace los cambios.
related: [deployment, migration]
lesson: ci-cd
