term: Proxy inverso
short: Un servidor que recibe las peticiones de los visitantes y se las pasa a los programas que tiene detrás, que no dan la cara. Suele encargarse del HTTPS, de repartir el trabajo entre varias copias y de contestar con un error si el programa de detrás falla. nginx y Caddy son dos de los más usados.
related: [server, https, load-balancer, x-forwarded-for]
lesson: reverse-proxy
