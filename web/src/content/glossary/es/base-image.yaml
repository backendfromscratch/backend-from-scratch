term: Imagen base
short: La imagen de la que parte otra, la del FROM de su Dockerfile, como node:26-slim. Pone el sistema y los programas que hay debajo de tus capas, así que de ella depende buena parte del tamaño de tu imagen y de sus fallos de seguridad conocidos.
related: [image, image-layer, multi-stage-build]
lesson: small-images
