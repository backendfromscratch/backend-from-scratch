term: Estado de Terraform
short: El fichero, terraform.tfstate, donde Terraform apunta qué objetos reales creó para cada recurso de tus ficheros y todos sus datos. Con él sabe qué es suyo y qué tiene que cambiar. Guarda los valores en claro, secretos incluidos, así que nunca va a Git; en un equipo se guarda en un sitio compartido y protegido.
related: [terraform, secret, infrastructure-as-code]
lesson: terraform
