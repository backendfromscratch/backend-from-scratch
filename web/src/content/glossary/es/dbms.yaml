term: Sistema gestor de bases de datos (DBMS)
short: El programa que guarda los datos de una base de datos y atiende a quien quiere leerlos o cambiarlos, muchos a la vez, sin que unos borren lo de otros ni se pierda nada si se va la luz. PostgreSQL, MySQL y SQLite son sistemas gestores.
related: [database, server, relational-database]
lesson: phase-5
acronym:
  letters: DBMS
  stands: Database Management System
  translation: sistema de gestión de bases de datos
