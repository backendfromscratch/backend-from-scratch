term: Revalidación
short: Preguntar al servidor si una copia guardada en caché sigue valiendo, en lugar de descargarla otra vez. Si no ha cambiado, el servidor contesta con el código 304 y no la vuelve a mandar; si ha cambiado, manda la versión nueva.
related: [cache, etag, status-code]
lesson: http-caching
