term: WebSocket
short: Un protocolo para que el cliente y el servidor se manden mensajes en los dos sentidos, cuando quieran, por una misma conexión que se queda abierta. Empieza como una petición HTTP que pide cambiar de protocolo, y el servidor acepta con el código 101.
related: [sse, protocol, http, tcp, status-code]
lesson: realtime
