term: Terraform
short: Un programa de HashiCorp que crea, cambia y borra infraestructura (servidores, cortafuegos, registros DNS, contenedores…) a partir de ficheros que describen cómo tiene que quedar. Antes de tocar nada, enseña un plan con lo que va a cambiar. Habla con cada servicio a través de un proveedor, un complemento para su API.
related: [infrastructure-as-code, terraform-state, api]
lesson: terraform
