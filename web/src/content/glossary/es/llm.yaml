term: LLM
short: 'Un programa entrenado con muchísimo texto que, dado un texto, escribe cómo sigue. Claude, GPT o Gemini son LLM. Tu backend lo usa como una API más: le manda un texto y recibe otro, y paga por lo que lee y lo que escribe.'
related: [llm-token, llm-prompt, context-window, api]
lesson: model-apis
acronym:
  letters: LLM
  stands: Large Language Model
  translation: modelo de lenguaje grande
