term: Compresión
short: 'Reducir el tamaño de una respuesta antes de enviarla, para que llegue antes. El cliente dice qué formatos entiende (gzip, br o zstd) en la cabecera Accept-Encoding, y el servidor dice cuál ha usado en Content-Encoding. En una página web, el ahorro suele ser de tres cuartas partes o más.'
related: [header, response, content-negotiation]
lesson: http-headers
