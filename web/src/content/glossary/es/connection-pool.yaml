term: Pool de conexiones
short: Unas cuantas conexiones con la base de datos que un servidor mantiene abiertas y reutiliza. Cada consulta toma una libre y la devuelve al acabar. Abrir una conexión cuesta mucho más que usarla, y la base de datos solo acepta un número limitado a la vez.
related: [database, driver, server]
lesson: node-postgres
