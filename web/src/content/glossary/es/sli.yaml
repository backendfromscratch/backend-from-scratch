term: SLI
short: Un número que mide si el servicio va bien para quien lo usa, como «el porcentaje de peticiones que responden bien en menos de 500 ms». Es lo que se mide; el objetivo que se le pone es el SLO.
related: [slo, metric, latency]
acronym:
  letters: SLI
  stands: Service Level Indicator
  translation: indicador de nivel de servicio
