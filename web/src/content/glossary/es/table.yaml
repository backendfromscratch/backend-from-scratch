term: Tabla
short: Donde una base de datos guarda un tipo de cosa, como los productos. Cada fila es una de esas cosas y cada columna, un dato que todas tienen, con su tipo (un número, un texto, una fecha). Se parece a una hoja de cálculo, pero no admite un dato del tipo equivocado.
related: [database, sql, query]
lesson: sql
