term: Caché de construcción
short: Las capas que Docker guarda de construcciones anteriores para no repetir trabajo. Un paso se reutiliza si el anterior se reutilizó y el suyo no ha cambiado, ni su texto ni los ficheros que copia. En cuanto uno cambia, ese y todos los de detrás se vuelven a ejecutar.
related: [image-layer, cache, image]
lesson: layers
