term: JWT
short: Un texto con unos datos en JSON, como quién es alguien y hasta cuándo vale, y una firma que demuestra quién lo emitió y que nadie lo ha cambiado. No va cifrado, así que cualquiera que lo tenga puede leerlo, y no se puede anular antes de que caduque.
related: [json, hmac, digital-signature, session, api-key]
lesson: jwt
acronym:
  letters: JWT
  stands: JSON Web Token
  translation: token web JSON
