term: Rate limiting
short: Poner un máximo a cuántas veces se puede hacer algo en un rato, como 10 intentos de iniciar sesión cada 15 minutos (en español, «limitar la frecuencia»). Al pasarlo, el servidor contesta 429 y dice cuánto esperar. Frena a quien prueba contraseñas sin parar y a quien abusa de una API.
related: [brute-force, status-code, api, server]
lesson: rate-limiting
