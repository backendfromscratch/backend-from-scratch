term: VPS
short: Un servidor virtual que alquilas por meses en un centro de datos. Es una máquina virtual con su propio sistema, su IP pública y acceso de administrador, dentro de un ordenador físico que comparte con las de otros clientes.
related: [virtual-machine, data-center, server, public-ip]
lesson: vps
acronym:
  letters: VPS
  stands: Virtual Private Server
  translation: servidor privado virtual
