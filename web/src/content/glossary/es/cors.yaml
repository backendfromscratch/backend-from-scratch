term: CORS
short: La forma en que un servidor le dice al navegador qué otros orígenes pueden leer sus respuestas desde el código de una página, con cabeceras como Access-Control-Allow-Origin. Lo aplica el navegador, no el servidor.
related: [origin, same-origin-policy, preflight, header]
lesson: cors
acronym:
  letters: CORS
  stands: Cross-Origin Resource Sharing
  translation: compartir recursos entre orígenes distintos
