term: Huella (de una imagen)
short: El hash SHA-256 que nombra una imagen de Docker por su contenido, escrito como sha256 seguido de 64 caracteres (en inglés, digest). Una huella nombra siempre exactamente la misma imagen, y Docker la comprueba al descargarla, así que fijar una imagen por su huella impide que cambie sin que lo decidas tú.
related: [tag, image, hash, registry]
lesson: registry
