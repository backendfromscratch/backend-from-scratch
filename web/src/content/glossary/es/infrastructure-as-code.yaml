term: Infraestructura como código
short: Describir los servidores, cortafuegos, registros DNS y demás piezas de un sistema en ficheros de texto, en lugar de crearlos a mano en un panel. Los ficheros van a Git, se revisan como el código, y un programa como Terraform crea lo que describen. En inglés, infrastructure as code (IaC).
related: [terraform, terraform-state, git]
lesson: terraform
