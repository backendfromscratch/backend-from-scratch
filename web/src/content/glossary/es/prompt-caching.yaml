term: Caché de prompts
short: 'Que la API de un modelo guarde el principio de un prompt que se repite (las instrucciones, las herramientas) y lo cobre mucho más barato en las siguientes peticiones. Solo funciona si ese principio es idéntico, byte a byte, y pasa de un tamaño mínimo.'
related: [cache, llm-prompt, llm-token]
lesson: ai-in-production
