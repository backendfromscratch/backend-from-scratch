term: Contrato de una API
short: 'Lo que una API promete a quien la usa: qué rutas tiene, qué datos acepta cada una y qué responde, también cuando algo falla. Escrito en un formato como OpenAPI, también lo leen los programas, que pueden comprobar si se cumple.'
related: [openapi, api, schema]
lesson: openapi
acronym:
  letters: API
  stands: Application Programming Interface
  translation: interfaz de programación de aplicaciones
