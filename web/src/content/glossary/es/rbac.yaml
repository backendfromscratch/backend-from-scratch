term: RBAC
short: Una forma de organizar la autorización en la que cada cuenta tiene un rol, como cliente o administrador, y cada rol tiene una lista de permisos. Para cambiar lo que alguien puede hacer, se le cambia el rol, no los permisos uno a uno.
related: [authorization, least-privilege, user]
lesson: authorization
acronym:
  letters: RBAC
  stands: Role-Based Access Control
  translation: control de acceso basado en roles
