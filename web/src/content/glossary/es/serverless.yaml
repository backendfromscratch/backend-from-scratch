term: Serverless
short: Una forma de ejecutar código en la que no ves ningún servidor. Subes funciones, la plataforma arranca copias cuando llegan peticiones y las apaga cuando no hay, y pagas por petición y por tiempo de ejecución. Los servidores existen, pero son del proveedor.
related: [paas, iaas, stateless]
lesson: cloud-models
