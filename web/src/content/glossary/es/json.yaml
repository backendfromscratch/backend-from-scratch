term: JSON
short: 'Un formato para escribir datos como texto, con llaves, comillas y dos puntos: {"producto":"taza","cantidad":2}. Lo leen las personas y casi cualquier lenguaje de programación, y es el formato más común de los datos que viajan entre un frontend y un backend.'
related: [api, mime-type, request-body]
acronym:
  letters: JSON
  stands: JavaScript Object Notation
  translation: notación de objetos de JavaScript
