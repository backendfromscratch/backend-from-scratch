term: Búsqueda de texto completo
short: 'Buscar palabras dentro de textos teniendo en cuenta sus variantes (guante, guantes) y sin las palabras que no dicen nada (el, para). PostgreSQL la trae de serie, con tsvector, tsquery y un índice GIN. Encuentra palabras, no significados. En inglés, full-text search.'
related: [database-index, semantic-search]
lesson: embeddings
