term: QUIC
short: El protocolo de transporte de HTTP/3. Va sobre UDP y hace lo que hacía TCP (confirmar, reenviar lo perdido y ordenar), pero ordena cada petición por separado, y lleva TLS dentro. Nació en Google, y hoy el estándar lo usa como un nombre propio.
related: [udp, tcp, tls, http3]
lesson: http-versions
acronym:
  letters: QUIC
  stands: Quick UDP Internet Connections
  translation: conexiones rápidas de internet sobre UDP
