term: Hash de contraseñas
short: Guardar una contraseña como su hash, calculado con un algoritmo lento a propósito y con una sal, en vez de la contraseña. Para comprobarla, se repite el cálculo con lo que escribe la persona y se comparan los dos resultados; de lo guardado no se puede sacar la contraseña.
related: [hash, salt, encryption, authentication]
lesson: passwords
