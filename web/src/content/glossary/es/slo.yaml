term: SLO
short: 'El objetivo que te pones para un SLI, por ejemplo «el 99,5 % de las peticiones responde bien cada mes». No es un contrato con nadie: es la línea a partir de la cual decides que toca arreglar cosas.'
related: [sli, error-budget]
lesson: alerts
acronym:
  letters: SLO
  stands: Service Level Objective
  translation: objetivo de nivel de servicio
