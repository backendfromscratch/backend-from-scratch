term: Content Security Policy (CSP)
short: 'Una cabecera de respuesta con la que el servidor le dice al navegador de dónde puede cargar cada cosa una página: código, imágenes, estilos… Si alguien consigue colar código JavaScript en la página, el navegador no lo ejecuta. Es una segunda barrera contra el XSS, no el arreglo: el texto colado sigue en la página.'
related: [security-headers, xss, header]
lesson: injection
acronym:
  letters: CSP
  stands: Content Security Policy
  translation: política de seguridad del contenido
