term: ORM
short: Un paquete que traduce entre las tablas de una base de datos y los objetos de un programa. Pides los datos en el lenguaje del programa, él escribe el SQL y te devuelve cada fila como un objeto. Drizzle y Prisma son ORM para TypeScript.
related: [query-builder, sql, object, n-plus-one]
lesson: orm
acronym:
  letters: ORM
  stands: Object-Relational Mapping
  translation: mapeo objeto-relacional
