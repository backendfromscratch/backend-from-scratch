term: Pub/sub (publicación y suscripción)
short: 'Publicación y suscripción (en inglés, publish and subscribe): un sistema en el que unos programas publican mensajes en un canal y todos los que están suscritos en ese momento los reciben al instante, no uno solo como en una cola. Si nadie escucha, el mensaje se pierde. Quien publica no sabe quién escucha.'
related: [sse, message-queue, key-value-store]
lesson: scaling
