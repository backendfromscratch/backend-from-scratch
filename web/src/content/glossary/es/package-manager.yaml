term: Gestor de paquetes
short: Un programa que instala, actualiza y quita otros programas desde un catálogo, y trae también los que cada uno necesita para funcionar. En Ubuntu es apt, en un Mac, Homebrew, y para el código de Node.js, npm. Algunos catálogos los cuida un equipo, como el de Ubuntu; en otros, como npm, cualquiera puede publicar.
