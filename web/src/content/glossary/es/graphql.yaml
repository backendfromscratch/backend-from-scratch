term: GraphQL
short: Un lenguaje para pedir datos a una API en el que el cliente escribe una consulta con los campos exactos que quiere, y los recibe con esa misma forma. Todas las consultas van a la misma dirección, y el servidor publica un esquema con lo que se puede pedir. Lo creó Facebook en 2012.
related: [api, schema, rest]
lesson: api-alternatives
