term: Mock
short: 'Un doble de prueba que, a diferencia de otros que solo responden, además de dar respuestas preparadas, recuerda cómo lo han usado, para que la prueba pueda comprobar «se llamó una vez con este dato». Úsalo con cuidado: una prueba llena de mocks comprueba el mock más que tu código.'
related: [test-double, unit-test]
