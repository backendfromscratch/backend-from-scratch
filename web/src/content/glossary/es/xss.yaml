term: XSS
short: Un ataque en el que una página web incluye un texto que escribió otra persona, y ese texto trae código JavaScript que el navegador de cada visitante ejecuta como si fuera de la página. Se evita cambiando los símbolos especiales de cada dato, como «<», por una versión que el navegador muestra pero nunca lee como código.
related: [javascript, content-security-policy, sql-injection, cookie]
lesson: injection
acronym:
  letters: XSS
  stands: Cross-Site Scripting
  translation: secuencias de comandos entre sitios
