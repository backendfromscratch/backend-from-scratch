term: Driver (de base de datos)
short: El paquete que deja a un programa hablar con una base de datos. Abre la conexión, envía las consultas con el protocolo de esa base de datos y convierte las respuestas en datos del lenguaje del programa. En Node.js, el de PostgreSQL más usado es pg.
related: [database, package, connection-pool, protocol]
lesson: node-postgres
