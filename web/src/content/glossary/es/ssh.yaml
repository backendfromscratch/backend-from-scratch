term: SSH
short: El protocolo para abrir una terminal en otro ordenador a través de la red, como si estuvieras delante. Todo viaja cifrado, y demuestras quién eres con tu clave privada en lugar de con una contraseña.
related: [public-key, private-key, fingerprint, ssh-tunnel]
lesson: ssh
acronym:
  letters: SSH
  stands: Secure Shell
  translation: shell segura
