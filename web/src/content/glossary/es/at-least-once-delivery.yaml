term: Entrega al menos una vez
short: La promesa de una cola de que cada mensaje llegará una vez como mínimo, nunca ninguna. A cambio, puede llegar dos veces, por ejemplo si el trabajador cae justo antes de confirmar que terminó. Por eso lo que hace el trabajador debe ser idempotente.
related: [message-queue, worker, idempotent, idempotency-key, ack]
lesson: queues
