term: ETag
short: Una etiqueta que el servidor pone a cada versión de una respuesta, en la cabecera ETag. El navegador la devuelve al preguntar si su copia guardada sigue valiendo; si coincide, el servidor contesta con el código 304 y no vuelve a mandar el contenido.
related: [cache, revalidation, header]
lesson: http-caching
