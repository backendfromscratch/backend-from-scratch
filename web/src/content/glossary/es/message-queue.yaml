term: Cola de mensajes
short: Una lista de tareas pendientes que vive fuera de tu servidor. Un programa deja mensajes al final y otro los va cogiendo por el principio, uno a uno, a su ritmo. Así quien pide el trabajo no tiene que esperar a que termine.
related: [background-job, worker, at-least-once-delivery, key-value-store]
lesson: queues
