term: OAuth
short: Un estándar para que una aplicación consiga un permiso limitado en tu cuenta de otro servicio, como ver tus fotos, sin conocer tu contraseña. Das el permiso en la web del propio servicio, y este le entrega a la aplicación una llave que solo abre eso y que puedes retirar cuando quieras.
related: [openid-connect, pkce, authorization, api]
lesson: oauth
