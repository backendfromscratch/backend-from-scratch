term: Cabeceras de seguridad
short: 'Cabeceras de respuesta con las que el servidor le pide al navegador que se proteja: que vaya siempre por HTTPS, qué código puede ejecutar la página y de dónde, que no adivine el tipo de un fichero o cuánto contar a otras webs de la página de la que vienes. No arreglan los fallos del servidor: cierran puertas en el navegador.'
related: [header, hsts, https]
lesson: http-headers
