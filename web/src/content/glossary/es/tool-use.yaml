term: Uso de herramientas (tool use)
short: 'Que un modelo pida ejecutar una función de tu backend: tú le describes las herramientas (nombre, para qué sirve, qué datos lleva), él dice cuál quiere usar y con qué datos, tu código la ejecuta y le devuelve el resultado. También se llama function calling.'
related: [agent, json-schema, llm]
lesson: tool-use
