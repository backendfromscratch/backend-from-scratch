term: NoSQL
short: Una etiqueta para las bases de datos que no guardan los datos en tablas relacionadas ni se consultan con SQL, como los almacenes clave-valor y las bases de datos de documentos. No es una tecnología concreta, sino un grupo de ellas, y cada una funciona a su manera y sirve para casos distintos.
related: [database, sql, key-value-store, document-database]
lesson: nosql
