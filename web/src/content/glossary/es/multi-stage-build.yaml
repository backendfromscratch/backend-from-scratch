term: Construcción multi-stage
short: Un Dockerfile con varias etapas, cada una desde su propio FROM. Las primeras instalan, compilan o comprueban, y la última copia de ellas solo lo que el programa necesita para ejecutarse. Lo demás, como las herramientas de desarrollo, se queda fuera de la imagen final.
related: [dockerfile, image, base-image]
lesson: small-images
