term: SSE
short: Una forma de que el servidor avise al cliente en cuanto pasa algo. El cliente hace una petición HTTP normal y el servidor deja la respuesta abierta, escribiendo en ella un evento, unas líneas de texto, cada vez que hay una novedad. Solo va en un sentido, del servidor al cliente.
related: [websocket, stream, response, http]
lesson: realtime
acronym:
  letters: SSE
  stands: Server-Sent Events
  translation: eventos enviados por el servidor
