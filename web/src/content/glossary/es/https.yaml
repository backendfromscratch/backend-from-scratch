term: HTTPS
short: HTTP dentro de una conexión TLS, normalmente en el puerto 443. Nadie en el camino puede leer ni cambiar las peticiones y respuestas, y el navegador comprueba con un certificado que el servidor es el del dominio.
related: [http, tls, certificate]
acronym:
  letters: HTTPS
  stands: HyperText Transfer Protocol Secure
  translation: protocolo de transferencia de hipertexto seguro
