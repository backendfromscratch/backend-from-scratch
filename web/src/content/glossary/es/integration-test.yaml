term: Prueba de integración (integration test)
short: Una prueba automática que hace trabajar juntas varias piezas de verdad, por ejemplo tu código y una base de datos PostgreSQL real, para comprobar que encajan. Tarda más que una prueba unitaria, pero encuentra fallos que esta no ve.
related: [unit-test, end-to-end-test, database]
lesson: test-types
