term: Docker Compose
short: Una herramienta de Docker que arranca varios contenedores a partir de un fichero, compose.yaml, que describe cada uno con su imagen, sus variables, sus puertos y sus volúmenes. Con docker compose up se ponen en marcha todos, en orden y en una red propia, y con docker compose down se paran.
related: [docker, container, image, docker-network]
lesson: compose
