term: JSON
short: 'A format for writing data as text, with braces, quotes and colons: {"product":"mug","quantity":2}. People can read it, and so can almost any programming language, and it’s the most common format for the data that travels between a frontend and a backend.'
related: [api, mime-type, request-body]
acronym:
  letters: JSON
  stands: JavaScript Object Notation
