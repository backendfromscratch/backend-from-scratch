term: JWT
short: A piece of text with some data in JSON, like who someone is and until when it’s valid, and a signature that proves who issued it and that nobody has changed it. It usually isn’t encrypted, so anyone who has it can read it, and it can’t be canceled before it expires without keeping a separate list.
related: [json, hmac, digital-signature, session, api-key]
lesson: jwt
acronym:
  letters: JWT
  stands: JSON Web Token
