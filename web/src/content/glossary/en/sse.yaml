term: SSE
short: A way for the server to notify the client as soon as something happens. The client makes a normal HTTP request and the server leaves the response open, writing an event into it, a few lines of text, every time there’s news. It only goes one way, from the server to the client.
related: [websocket, stream, response, http]
lesson: realtime
acronym:
  letters: SSE
  stands: Server-Sent Events
