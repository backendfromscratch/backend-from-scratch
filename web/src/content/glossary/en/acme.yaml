term: ACME
short: The protocol a program on your server, such as certbot, uses to ask a certificate authority like Let’s Encrypt for a certificate, prove that it controls the domain (for example, by publishing a file on port 80) and renew it without you stepping in.
related: [lets-encrypt, certificate-authority, protocol]
lesson: domain-https
acronym:
  letters: ACME
  stands: Automatic Certificate Management Environment
