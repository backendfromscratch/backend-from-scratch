term: CAP theorem
short: 'A rule about distributed systems: when the network splits, the system has to choose between continuing to answer, even if some answers are out of date (availability), or refusing to answer until it has the correct data (consistency). While the network is healthy, there is no choice to make.'
related: [distributed-system, network-partition, eventual-consistency, replication]
lesson: cap
acronym:
  letters: CAP
  stands: Consistency, Availability, Partition tolerance
