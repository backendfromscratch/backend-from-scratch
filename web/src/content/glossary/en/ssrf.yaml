term: SSRF
short: An attack in which someone gives a server a URL to visit, and the server’s request reaches places only it can reach, like its own database, the internal network or the credentials the cloud gives it. It’s stopped by checking which IP address the URL points to before connecting.
related: [server, url, private-ip, localhost, request, ip-address]
lesson: csrf-ssrf
acronym:
  letters: SSRF
  stands: Server-Side Request Forgery
