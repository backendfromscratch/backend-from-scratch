term: URL
short: 'The address of something on the web, such as https://shop.example/products?sort=price. It says which protocol to ask for it with (https), which server to ask (shop.example) and which page or file on that server (/products), and it can carry extra data in the query string.'
related: [http, query-string, server]
lesson: http-messages
acronym:
  letters: URL
  stands: Uniform Resource Locator
