term: HTTP/2
short: The 2015 version of HTTP. It says the same as HTTP/1.1, but cut into pieces and in a format made for machines, not text, and it carries many requests at once over a single TCP connection. Browsers only use it with HTTPS.
related: [http, multiplexing, alpn, http3]
lesson: http-versions
acronym:
  letters: HTTP
  stands: HyperText Transfer Protocol
