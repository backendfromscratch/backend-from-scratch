term: Protobuf
short: 'A format for serializing data in binary (bytes that aren’t text), created by Google; its full name is Protocol Buffers. The fields are described in a schema, a .proto file, and the bytes carry each field’s number instead of its name. It takes up less space than JSON, but without the schema it can’t be read.'
related: [serialization, schema, json]
lesson: serialization
