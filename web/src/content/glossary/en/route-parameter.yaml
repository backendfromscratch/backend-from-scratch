term: Route parameter
short: 'A variable piece of a route, marked with a colon: in /products/:id, the :id. The route accepts any value there (/products/2, /products/7) and hands it to your code, always as text. It says which resource you’re asking for; to filter or search a list, you use the query string.'
related: [route, query-string, url]
lesson: frameworks
