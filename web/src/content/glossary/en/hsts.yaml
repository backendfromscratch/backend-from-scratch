term: HSTS
short: 'The Strict-Transport-Security header, with which a site asks the browser to connect to it only over HTTPS for as long as it says, even if you type http:// or follow an old link. The browser only takes it into account if it arrives over HTTPS.'
related: [https, security-headers, tls]
lesson: http-headers
acronym:
  letters: HSTS
  stands: HTTP Strict Transport Security
