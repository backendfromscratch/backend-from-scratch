term: Content Security Policy (CSP)
short: 'A response header with which the server tells the browser where a page may load each thing from: code, images, styles… If someone manages to slip JavaScript code into the page, the browser doesn’t run it. It’s a second barrier against XSS, not the fix: the text that slipped in is still on the page.'
related: [security-headers, xss, header]
lesson: injection
acronym:
  letters: CSP
  stands: Content Security Policy
