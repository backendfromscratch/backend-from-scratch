term: MCP
short: 'An open protocol that lets an AI agent discover a server’s tools and use them, whichever the agent and whichever the server. Underneath it’s JSON-RPC messages: tools/list to see the list, tools/call to use one. Anthropic published it in 2024.'
related: [json-rpc, protocol, api-key, server]
lesson: mcp
acronym:
  letters: MCP
  stands: Model Context Protocol
