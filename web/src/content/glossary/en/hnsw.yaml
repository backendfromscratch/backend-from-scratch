term: HNSW
short: 'An index to find the vectors nearest to a given one without reading the whole table: a graph in floors in which the search jumps from neighbor to neighbor until it gets close. It’s approximate: much faster than reading the whole table, but it doesn’t guarantee finding the truly nearest ones.'
related: [database-index, b-tree, embedding]
lesson: embeddings
acronym:
  letters: HNSW
  stands: Hierarchical Navigable Small World
