term: QUIC
short: The transport protocol of HTTP/3. It runs over UDP and does what TCP did (confirming receipt, resending what was lost and putting things in order), but it orders each request separately, and it carries TLS inside. It was born at Google with that long name; today’s standard uses just QUIC, as a name rather than an acronym.
related: [udp, tcp, tls, http3]
lesson: http-versions
acronym:
  letters: QUIC
  stands: Quick UDP Internet Connections
