term: BOLA
short: 'The flaw in an API that lets you see or change someone else’s data, like an order or an invoice, just by changing its number in the URL. The API checks who you are, but not whether that data is yours. It’s very common: it tops OWASP’s list of API flaws.'
related: [authorization, api, url, route-parameter, owasp]
lesson: authorization
acronym:
  letters: BOLA
  stands: Broken Object Level Authorization
