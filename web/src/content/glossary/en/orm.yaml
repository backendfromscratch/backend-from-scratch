term: ORM
short: A package that translates between a database’s tables and a program’s objects. You ask for the data in the program’s language, it writes the SQL and gives you back each row as an object. Drizzle and Prisma are ORMs for TypeScript.
related: [query-builder, sql, object, n-plus-one]
lesson: orm
acronym:
  letters: ORM
  stands: Object-Relational Mapping
