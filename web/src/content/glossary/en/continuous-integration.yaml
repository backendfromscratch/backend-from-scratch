term: Continuous integration (CI)
short: Merging changes into the main branch often, with a program that checks each one before it is accepted (installs, checks the types, runs the tests). If something breaks, you know within minutes, and you know which change did it.
related: [continuous-deployment, github-actions, commit, branch]
lesson: ci-cd
acronym:
  letters: CI
  stands: Continuous Integration
