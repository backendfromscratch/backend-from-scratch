term: JSON-RPC
short: 'A way to call a function in another program with a JSON message: the function’s name (method), its arguments (params) and an id, which the response repeats. A message without an id is a notification and expects no response. RPC stands for remote procedure call.'
related: [json, grpc, protocol]
lesson: mcp
acronym:
  letters: JSON
  stands: JavaScript Object Notation
