term: Cursor (in pagination)
short: 'A piece of text that marks how far you’ve read in a list split into pages, so you can ask for “the ones after this one.” The server writes it, and the client only sends it back as it is. Unlike “skip the first 20,” it doesn’t get it wrong if the list changes between one page and the next.'
related: [pagination, query-string]
lesson: pagination
