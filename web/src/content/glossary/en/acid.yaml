term: ACID
short: The four guarantees of a transaction. It happens completely or not at all (atomicity), it leaves the data following the rules of its tables (consistency), it doesn’t see the half-finished work of the others (isolation) and, once confirmed, it survives a power outage (durability).
related: [transaction, isolation-level, database]
lesson: transactions
acronym:
  letters: ACID
  stands: Atomicity, Consistency, Isolation, Durability
