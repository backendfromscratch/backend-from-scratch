term: Problem Details
short: 'The standard shape of the body of an error response in an API, written down in RFC 9457: a JSON with type (what kind of problem it is), title (its summary), status (the status code), detail (what happened this time) and instance (which of the times). It’s sent with the content type application/problem+json.'
related: [status-code, json, mime-type, api, rfc]
lesson: api-errors
