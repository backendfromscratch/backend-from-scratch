term: LLM
short: 'A program trained on a huge amount of text that, given some text, writes how it continues. Claude, GPT and Gemini are LLMs. Your backend uses one like any other API: it sends text and gets text back, and pays for what the model reads and what it writes.'
related: [llm-token, llm-prompt, context-window, api]
lesson: model-apis
acronym:
  letters: LLM
  stands: Large Language Model
