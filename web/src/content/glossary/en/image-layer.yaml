term: Layer (of an image)
short: Each of the read-only pieces that make up a Docker image. It holds the files that one step of the image’s recipe added, changed or deleted, and the layers stack up to form the container’s files. It’s named by the fingerprint of its content, so several images share the layers that are identical and they’re stored only once.
related: [image, build-cache, container]
lesson: layers
