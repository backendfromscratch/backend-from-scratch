term: HTTP/3
short: The 2022 version of HTTP. It does the same as HTTP/2, but over QUIC, on UDP, instead of TCP. That way, a lost piece only delays its own request, and the connection survives a change of network.
related: [http, quic, http2, udp]
lesson: http-versions
acronym:
  letters: HTTP
  stands: HyperText Transfer Protocol
