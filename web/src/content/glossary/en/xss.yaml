term: XSS
short: An attack in which a web page includes text someone else wrote, and that text carries JavaScript code that each visitor’s browser runs as if it were the page’s own. It’s prevented by replacing the special characters in each piece of data, like “<”, with a version the browser shows but never reads as code.
related: [javascript, content-security-policy, sql-injection, cookie]
lesson: injection
acronym:
  letters: XSS
  stands: Cross-Site Scripting
