term: SQL injection
short: An attack that sends a value crafted so that, pasted inside the text of a query, it changes what the query does, such as returning every row or deleting a table. It’s prevented by sending the values separately, as parameters, and never pasting them into the SQL.
related: [sql, query, validation]
lesson: node-postgres
acronym:
  letters: SQL
  stands: Structured Query Language
