term: Database management system (DBMS)
short: The program that stores a database’s data and serves whoever wants to read or change it, many at once, without anyone erasing someone else’s changes and without losing anything if the power goes out. PostgreSQL, MySQL and SQLite are database management systems.
related: [database, server, relational-database]
lesson: phase-5
acronym:
  letters: DBMS
  stands: Database Management System
