term: PKCE
short: A protection for signing in with OAuth. The website makes up a random secret and, at the start, only sends its hash; to exchange the code it receives on the way back, it has to show the secret, so a stolen code is useless to anyone else.
related: [oauth, openid-connect, hash]
lesson: oauth
acronym:
  letters: PKCE
  stands: Proof Key for Code Exchange
