term: ALPN
short: The part of the TLS handshake in which the client and the server choose which protocol they will speak next, for example HTTP/2 (h2) or HTTP/1.1. It’s settled without spending a single extra round trip.
related: [tls, handshake, http2]
lesson: http-versions
acronym:
  letters: ALPN
  stands: Application-Layer Protocol Negotiation
