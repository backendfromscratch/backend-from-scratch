term: OWASP
short: An open community, backed by a nonprofit foundation, that publishes free guides and tools for building secure web applications. Its best-known document is the OWASP Top 10, the list of the ten most serious risks for web applications.
related: [authorization, sql-injection, security-headers]
lesson: owasp
acronym:
  letters: OWASP
  stands: Open Worldwide Application Security Project
