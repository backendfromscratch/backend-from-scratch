term: MIME type
short: 'The label that says what kind of data a message carries, in the form type/subtype: text/html is a web page, application/json is data in JSON and image/png a PNG image. In HTTP it goes in the Content-Type header. It’s also called a media type.'
related: [header, request-body, json]
lesson: http-messages
acronym:
  letters: MIME
  stands: Multipurpose Internet Mail Extensions
