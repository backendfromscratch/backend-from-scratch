term: Cosine distance
short: 'How far apart two vectors are by the angle between them, regardless of their length: 0 if they point the same way, 1 if they have nothing to do with each other and 2 if they point in opposite directions. Between two embeddings, it says how alike two texts are. In pgvector, it’s the <=> operator.'
related: [embedding, hnsw]
lesson: embeddings
