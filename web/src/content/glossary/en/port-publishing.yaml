term: Publishing a port
short: Connecting a port on your computer to a port in a container, with the -p option of docker run, so that whatever reaches the first one goes into the second. Without an IP in front, Docker opens the port on all of your computer’s addresses, and anyone on your network can reach it; with 127.0.0.1 in front, only your computer can.
related: [port, container, localhost]
lesson: networks
