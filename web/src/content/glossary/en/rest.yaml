term: REST
short: 'A way of designing APIs on top of HTTP: each thing is a resource with its own URL, and you work with it using the usual methods (GET, POST, PATCH, DELETE) and status codes. Roy Fielding described it in 2000; today the name is used for almost any JSON API organized this way.'
related: [api, resource, endpoint, stateless, http-method]
lesson: rest
acronym:
  letters: REST
  stands: Representational State Transfer
