term: CSRF
short: An attack in which a page makes your browser send a request to a site where you’re logged in, with your cookies, to do something on your behalf, such as changing your email or buying something. CORS doesn’t prevent it, because many requests reach the server even if the page can’t read the response.
related: [cors, same-origin-policy, request, cookie, session]
lesson: cors
acronym:
  letters: CSRF
  stands: Cross-Site Request Forgery
