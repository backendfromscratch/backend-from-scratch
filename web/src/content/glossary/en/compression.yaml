term: Compression
short: 'Shrinking a response before sending it, so it arrives sooner. The client says which formats it understands (gzip, br or zstd) in the Accept-Encoding header, and the server says which one it used in Content-Encoding. On a web page, it usually cuts the size by three quarters or more.'
related: [header, response, content-negotiation]
lesson: http-headers
