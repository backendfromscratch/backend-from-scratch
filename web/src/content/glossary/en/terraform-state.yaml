term: Terraform state
short: The file, terraform.tfstate, where Terraform records which real objects it created for each resource in your files, with all their data. That is how it knows what is its own and what it needs to change. It stores the values in plain text, secrets included, so it never goes to Git; a team keeps it in a shared, protected place.
related: [terraform, secret, infrastructure-as-code]
