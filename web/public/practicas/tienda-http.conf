# El servidor web de la tienda de Ana y Luis, para la Fase 2 de Backend desde cero,
# «HTTP a fondo»: https://backenddesdecero.com/fase-2/
#
# Es una configuración de nginx para tu máquina virtual de prácticas (la de la Fase 1).
# Escucha en el puerto 8080, así que el sitio que ya tenías en el 80 sigue igual.
# Cada lección de la fase cambia una línea de aquí, recarga nginx y mira qué cambia.
#
# Instalación, dentro de la VM:
#   sudo cp tienda-http.conf /etc/nginx/sites-available/tienda
#   sudo ln -s /etc/nginx/sites-available/tienda /etc/nginx/sites-enabled/tienda
#   sudo nginx -t && sudo systemctl reload nginx
#
# Para quitarla:
#   sudo rm /etc/nginx/sites-enabled/tienda && sudo systemctl reload nginx

server {
    listen 8080;
    listen [::]:8080;

    # Los ficheros estáticos (las imágenes de /img/) viven en esta carpeta.
    root /var/www/tienda;
    charset utf-8;

    # La portada: dice qué rutas hay.
    location = / {
        default_type text/plain;
        return 200 'Tienda de Ana y Luis. Prueba /productos, /ofertas, /carrito, /api/pedidos, /img/ y /mantenimiento.\n';
    }

    # La lista de productos, en JSON. Solo se puede leer: cualquier otro método recibe
    # un 405 con la cabecera Allow, que dice cuáles sí se aceptan.
    location = /productos {
        if ($request_method !~ ^(GET|HEAD)$) {
            add_header Allow "GET, HEAD" always;
            return 405;
        }
        default_type application/json;
        return 200 '[{"id":1,"nombre":"Camiseta","precio":20},{"id":2,"nombre":"Taza","precio":8.5},{"id":3,"nombre":"Sudadera","precio":35}]\n';
    }

    # Una página que se ha movido para siempre: redirige a /productos.
    location = /ofertas {
        return 301 /productos;
    }

    # El carrito: la primera visita recibe una cookie con el identificador del carrito.
    location = /carrito {
        add_header Set-Cookie "carrito=c4f9e2; Path=/; Max-Age=3600; HttpOnly; SameSite=Lax" always;
        default_type text/plain;
        return 200 'Tu carrito está vacío.\n';
    }

    # La API que usa el frontend de la tienda, que vive en otro origen
    # (https://tienda.example). CORS le permite leer las respuestas.
    location /api/ {
        # La petición previa (preflight) que el navegador manda antes de un POST con JSON.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://tienda.example" always;
            add_header Access-Control-Allow-Methods "GET, POST" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Vary Origin always;
            return 204;
        }
        add_header Access-Control-Allow-Origin "https://tienda.example" always;
        add_header Vary Origin always;
        default_type application/json;
        return 200 '{"pedidos":[]}\n';
    }

    # Las imágenes: ficheros de /var/www/tienda/img/. nginx añade ETag y Last-Modified
    # por su cuenta; aquí se dice cuánto tiempo se pueden guardar.
    location /img/ {
        add_header Cache-Control "public, max-age=3600";
    }

    # La tienda en mantenimiento: «vuelve dentro de dos minutos».
    location = /mantenimiento {
        add_header Retry-After 120 always;
        return 503;
    }
}
