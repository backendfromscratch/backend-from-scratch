# Práctica de la Fase 9, lección 6: un Redis principal y una réplica, para romperlas a propósito.
#   docker compose up -d                             arranca las dos
#   docker compose exec principal redis-cli          habla con el principal
#   docker compose exec replica redis-cli            habla con la réplica
#   docker compose down                              las para y borra los contenedores
#
# No publica ningún puerto: redis-cli se ejecuta dentro de cada contenedor, así que nada de
# esto es visible desde fuera de tu ordenador.

# El nombre del proyecto: los contenedores se llaman replicas-principal-1 y replicas-replica-1,
# y la red, replicas_red. Los necesitas para cortar la red (docker network disconnect).
name: replicas

services:
  # El principal: el único que acepta escrituras. Sin disco (--save "" y --appendonly no):
  # es una demo, y al borrar el contenedor no queda nada.
  principal:
    image: redis:8@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    networks: [red]

  # La réplica: copia todo lo que escribe el principal, que encuentra por el nombre del servicio.
  # Es de solo lectura: si le escribes, te dice que no.
  replica:
    image: redis:8@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    command:
      ['redis-server', '--replicaof', 'principal', '6379', '--save', '', '--appendonly', 'no']
    networks: [red]
    depends_on: [principal]

# Una red propia, y no la de por defecto: así puedes sacar a la réplica de ella con
# docker network disconnect replicas_red replicas-replica-1, y volver a meterla con connect.
networks:
  red:
