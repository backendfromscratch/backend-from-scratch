# Phase 9, lesson 6 practice: a Redis primary and a replica, to break on purpose.
#   docker compose up -d                           starts both
#   docker compose exec primary redis-cli          talks to the primary
#   docker compose exec replica redis-cli          talks to the replica
#   docker compose down                            stops them and deletes the containers
#
# It publishes no port: redis-cli runs inside each container, so none of this is reachable
# from outside your computer.

# The project name: the containers are called replicas-primary-1 and replicas-replica-1, and
# the network replicas_net. You need them to cut the network (docker network disconnect).
name: replicas

services:
  # The primary: the only one that accepts writes. No disk (--save "" and --appendonly no):
  # it is a demo, and nothing is left once the container is deleted.
  primary:
    image: redis:8@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    networks: [net]

  # The replica: it copies everything the primary writes, and finds it by the service name.
  # It is read-only: if you write to it, it says no.
  replica:
    image: redis:8@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    command: ['redis-server', '--replicaof', 'primary', '6379', '--save', '', '--appendonly', 'no']
    networks: [net]
    depends_on: [primary]

# A network of its own, not the default one: that way you can take the replica out of it with
# docker network disconnect replicas_net replicas-replica-1, and put it back with connect.
networks:
  net:
