# The web server of Ana and Luis's shop, for Phase 2 of Backend from Scratch,
# "HTTP in depth": https://backenddesdecero.com/en/phase-2/
#
# It is an nginx configuration for your practice virtual machine (the one from Phase 1).
# It listens on port 8080, so the site you already had on port 80 stays as it was.
# Each lesson of the phase changes one line here, reloads nginx and looks at what changes.
#
# To install it, inside the VM:
#   sudo cp shop-http.conf /etc/nginx/sites-available/shop
#   sudo ln -s /etc/nginx/sites-available/shop /etc/nginx/sites-enabled/shop
#   sudo nginx -t && sudo systemctl reload nginx
#
# To remove it:
#   sudo rm /etc/nginx/sites-enabled/shop && sudo systemctl reload nginx

server {
    listen 8080;
    listen [::]:8080;

    # The static files (the images under /img/) live in this folder.
    root /var/www/shop;
    charset utf-8;

    # The home page: it says which paths exist.
    location = / {
        default_type text/plain;
        return 200 'Ana and Luis\'s shop. Try /products, /offers, /cart, /api/orders, /img/ and /maintenance.\n';
    }

    # The product list, in JSON. It can only be read: any other method gets a 405 with
    # the Allow header, which says which ones are accepted.
    location = /products {
        if ($request_method !~ ^(GET|HEAD)$) {
            add_header Allow "GET, HEAD" always;
            return 405;
        }
        default_type application/json;
        return 200 '[{"id":1,"name":"T-shirt","price":20},{"id":2,"name":"Mug","price":8.5},{"id":3,"name":"Hoodie","price":35}]\n';
    }

    # A page that has moved for good: it redirects to /products.
    location = /offers {
        return 301 /products;
    }

    # The cart: the first visit gets a cookie with the cart's identifier.
    location = /cart {
        add_header Set-Cookie "cart=c4f9e2; Path=/; Max-Age=3600; HttpOnly; SameSite=Lax" always;
        default_type text/plain;
        return 200 'Your cart is empty.\n';
    }

    # The API the shop's frontend uses, which lives on another origin
    # (https://shop.example). CORS lets it read the responses.
    location /api/ {
        # The preflight request the browser sends before a POST with JSON.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://shop.example" always;
            add_header Access-Control-Allow-Methods "GET, POST" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Vary Origin always;
            return 204;
        }
        add_header Access-Control-Allow-Origin "https://shop.example" always;
        add_header Vary Origin always;
        default_type application/json;
        return 200 '{"orders":[]}\n';
    }

    # The images: files in /var/www/shop/img/. nginx adds ETag and Last-Modified on its
    # own; this says how long they can be kept.
    location /img/ {
        add_header Cache-Control "public, max-age=3600";
    }

    # The shop under maintenance: "come back in two minutes".
    location = /maintenance {
        add_header Retry-After 120 always;
        return 503;
    }
}
