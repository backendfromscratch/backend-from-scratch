# nginx delante de la tienda (Fase 8, lección 4). nginx escucha en los puertos 80 y 443, los únicos
# que el cortafuegos deja pasar, y reenvía lo que llega a la API, que solo escucha en 127.0.0.1.
# Instálalo con:
#   sudo cp nginx/tienda.conf /etc/nginx/sites-available/tienda
#   sudo ln -s /etc/nginx/sites-available/tienda /etc/nginx/sites-enabled/tienda
#   sudo nginx -t && sudo systemctl reload nginx    (nginx -t comprueba el fichero antes)
#
# Antes de instalarlo, cambia dos cosas:
#   1. tienda.example, en las dos líneas server_name, por tu nombre: tu dominio o, con el camino
#      gratuito, el nombre de sslip.io de tu servidor.
#   2. El certificado: tal como está, usa el de tu propia autoridad de certificación (camino
#      gratuito, lección 5), copiado en /etc/ssl/tienda/. En el camino de pago, certbot --nginx
#      sustituye esas dos líneas por las de Let's Encrypt (que están más abajo, comentadas).

# #region upstream
# Las copias de la API que nginx conoce: api-a, en el puerto 3000, y api-b, en el 3001 (hasta el
# paso 39, una sola copia, en uno de los dos). Si una falla, nginx la deja de intentar durante
# fail_timeout. Es su comprobación pasiva: no pregunta si una copia vive, mira qué pasa con las
# peticiones de verdad. Una conexión rechazada (la copia está parada o apagándose) la repite en la
# otra, aunque sea un POST: la petición no llegó a salir. Eso, si Docker no pone su docker-proxy
# delante de los puertos (el README dice cómo quitarlo): el proxy acepta la conexión y la corta
# después, y nginx no repite un POST que ya ha mandado. Con las dos caídas, el visitante recibe 502
# (Bad Gateway).
upstream tienda {
    server 127.0.0.1:3000 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=1 fail_timeout=10s;
}
# #endregion upstream

# #region websocket
# Lo que pide una conexión que cambia a WebSocket (la ruta /eco): si el navegador manda Upgrade,
# nginx se lo pasa a la API; si no, no manda la cabecera Connection.
map $http_upgrade $conexion_cabecera {
    default upgrade;
    ''      '';
}
# #endregion websocket

# #region puerto-80
# Puerto 80: todo se redirige a HTTPS, salvo el reto con el que Let's Encrypt comprueba que el
# dominio es tuyo (certbot lo atiende; lección 5).
server {
    listen 80;
    listen [::]:80;
    server_name tienda.example;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
# #endregion puerto-80

# #region https
# Puerto 443: HTTPS, y la tienda detrás (el bloque sigue: lo de abajo va dentro).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tienda.example;

    # El certificado del servidor y su clave. En la lección 4, uno provisional autofirmado (curl -k);
    # la lección 5 lo cambia por uno firmado por tu propia autoridad de certificación (openssl). Así
    # funciona sin dominio: el navegador avisa porque no conoce esa autoridad, y curl --cacert la
    # acepta.
    ssl_certificate     /etc/ssl/tienda/tienda.crt;
    ssl_certificate_key /etc/ssl/tienda/tienda.key;
    # Con un dominio y Let's Encrypt, certbot --nginx cambia las dos líneas de arriba por estas (o las
    # cambias tú), con el nombre de tu dominio en la carpeta:
    # ssl_certificate     /etc/letsencrypt/live/tienda.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tienda.example/privkey.pem;
# #endregion https

    # #region cabeceras
    # Lo que la API necesita saber de quien pide, porque ella solo ve a nginx. Lo heredan todos los
    # location de abajo (si un location pone un proxy_set_header propio, deja de heredarlos).
    #   Host                la dirección que escribió el visitante
    #   X-Forwarded-For     lo que ya traía la cabecera (que el visitante pudo escribir) y, al
    #                       final, la IP del visitante, que añade nginx: la API lee la última
    #                       entrada. Solo se fía de la cabecera si la conexión llega de
    #                       PROXY_CONFIABLE, la dirección desde la que nginx le habla (con Docker,
    #                       la puerta de enlace de la red), que no es la del visitante
    #   X-Forwarded-Proto   https: el visitante usó HTTPS, aunque a la API le llegue por http
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # #endregion cabeceras
    # #region pasar
    # HTTP/1.1 con la API, para las conexiones largas, y el cambio a WebSocket.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conexion_cabecera;

    location / {
        proxy_pass http://tienda;
    }
    # #endregion pasar

    # #region eventos
    # Los eventos de un pedido (Server-Sent Events): una respuesta que no termina, y que va dando
    # trozos. Dos cosas por las que el location propio:
    #   - proxy_buffering off: con el buffering (el valor por defecto), nginx guarda lo que la API
    #     manda hasta tener un bloque entero. Medido en la lección: por HTTP/1.1, casi nunca
    #     llega ni el primer evento; por HTTP/2, nginx sí los va soltando.
    #   - proxy_read_timeout 1h: si la API pasa 60 segundos sin enviar nada (el valor por defecto),
    #     nginx corta la conexión. Medido: a los 60 s exactos, un error de nginx en el log.
    location ~ ^/v2/pedidos/[^/]+/eventos$ {
        proxy_pass http://tienda;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    # #endregion eventos

    # #region eco
    # El eco por WebSocket (/eco): una conexión que puede pasar mucho sin mandar nada. Con los 60
    # segundos por defecto, nginx la cortaría; aquí, una hora.
    location = /eco {
        proxy_pass http://tienda;
        proxy_read_timeout 1h;
    }
    # #endregion eco
}
