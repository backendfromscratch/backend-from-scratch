# De dónde lee Grafana (Fase 10, lección 5): Prometheus, para las métricas, y Jaeger, para las
# trazas. Ojo con Jaeger: el conector de Grafana pregunta por la API antigua (/api/services) y Jaeger 2.22
# ya solo sirve la nueva (/api/v3), así que su prueba de salud da un 404 y buscar trazas desde Grafana
# no funciona todavía; las trazas se miran en la web de Jaeger (16686). Los uid son los nombres con los que los paneles se refieren a ellas: «prom» y «jaeger».
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
