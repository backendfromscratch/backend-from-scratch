# De dónde lee Grafana (Fase 10, lección 5): Prometheus, para las métricas. Las trazas no están
# aquí: el conector de Grafana para Jaeger pregunta por la API antigua (/api/services) y Jaeger 2.22
# solo sirve la nueva (/api/v3), así que no funcionaría. Las trazas se miran en la web de Jaeger,
# en http://127.0.0.1:16686. El uid es el nombre con el que los paneles se refieren a la fuente.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
