// El mismo pedido que la API manda en JSON, descrito para Protobuf. Cada campo lleva un número:
// en los bytes va ese número, no el nombre del campo.
syntax = "proto3";

package tienda;

// Un enum: en los bytes, el estado es un número pequeño, no un texto como "pendiente".
enum Estado {
  ESTADO_SIN_DEFINIR = 0;
  PENDIENTE = 1;
  PAGADO = 2;
  ENVIADO = 3;
  CANCELADO = 4;
}

message Pedido {
  uint32 id = 1;
  uint32 producto_id = 2;
  uint32 cantidad = 3;
  Estado estado = 4;
  string creado_en = 5;
}
