# Dónde busca Grafana sus paneles (Fase 10, lección 5): los .json de esta carpeta, que Compose
# monta desde observabilidad/grafana/paneles/. Los paneles son ficheros, no clics: se guardan en
# Git, se revisan y se vuelven a crear en cualquier ordenador.
apiVersion: 1

providers:
  - name: tienda
    type: file
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/paneles
