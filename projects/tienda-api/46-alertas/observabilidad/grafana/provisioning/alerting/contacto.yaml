# A quién avisa Grafana (Fase 10, lección 6): un punto de contacto, «guardia», que manda un correo a
# guardia@tienda.example. El correo sale por el servidor SMTP de GF_SMTP_* (compose.observabilidad.yaml):
# Mailpit, que no lo manda a nadie y lo enseña en http://localhost:8025. En un equipo de verdad,
# aquí iría el correo de quien está de guardia, o un canal de chat, o un servicio que llama por
# teléfono (Grafana sabe hablar con muchos: type: slack, pagerduty, webhook…).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: guardia
    receivers:
      - uid: guardia-correo
        type: email
        settings:
          addresses: guardia@tienda.example
          # Un correo para todas las direcciones, no uno por dirección.
          singleEmail: true
        # También cuando se resuelve: el correo de «RESOLVED» dice que ya ha pasado.
        disableResolveMessage: false
