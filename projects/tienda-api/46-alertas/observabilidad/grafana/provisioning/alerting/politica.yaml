# Cómo reparte Grafana las alertas entre los puntos de contacto (Fase 10, lección 6): la política
# de notificación. Aquí hay una sola, la raíz: todo, a «guardia» (contacto.yaml).
#   group_by: alertname: cada regla, en su propio correo. Con la tienda caída, las tres reglas
#     saltarían a la vez, y tres correos con asunto claro se leen mejor que uno con todo mezclado.
#   group_wait: 10s: cuánto espera antes del primer correo de un grupo, por si llega otra alerta
#     del mismo grupo y caben en uno.
#   group_interval: 1m: cuánto espera para avisar de un cambio en un grupo que ya ha avisado.
#   repeat_interval: 4h: si sigue igual, lo recuerda cada 4 horas, no cada minuto: una alerta que
#     repite sin parar acaba en un filtro del correo (fatiga de alertas).
apiVersion: 1

policies:
  - orgId: 1
    receiver: guardia
    group_by: ['alertname']
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
