# La configuración de Jaeger 2 (Fase 10, lección 5). Es la que trae la imagen para probar (todo en
# uno: recibe, guarda en memoria y enseña), con una sola diferencia: max_traces, el tope de trazas
# que guarda en memoria. Sin tope razonable, una carga de miles de peticiones por segundo
# (npm run carga) llena la memoria de la máquina virtual de Docker y el sistema mata a Jaeger.
# Con el tope, cuando se llena, tira las más antiguas: siempre están las últimas.
# Por qué 5000: medido el 2026-10-24 con npm run carga (261 000 peticiones en 35 s, una traza cada
# una), Jaeger llegó a 68 MiB, muy por debajo de los 300 MiB que le tocan de los 2 GiB de la máquina
# virtual, compartidos con la tienda, PostgreSQL, Redis, Prometheus y Grafana. Sin este tope, la
# misma carga lo llenó y lo mataron. Si tus trazas son más grandes, o tienes más memoria, sube el número.
extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_query:
    storage:
      traces: memoria
    http:
      endpoint: 0.0.0.0:16686
  jaeger_storage:
    backends:
      memoria:
        memory:
          max_traces: 5000

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memoria

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
