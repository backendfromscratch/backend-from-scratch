# nginx delante de la tienda (Fase 8, lección 4). nginx escucha en los puertos 80 y 443, los únicos
# que el cortafuegos deja pasar, y reenvía lo que llega a la API, que solo escucha en 127.0.0.1.
# Instálalo con:
#   sudo cp nginx/tienda.conf /etc/nginx/sites-available/tienda
#   sudo ln -s /etc/nginx/sites-available/tienda /etc/nginx/sites-enabled/tienda
#   sudo nginx -t && sudo systemctl reload nginx    (nginx -t comprueba el fichero antes)
#
# Antes de instalarlo, cambia dos cosas:
#   1. tienda.example, en las dos líneas server_name, por tu nombre: tu dominio o, con el camino
#      gratuito, el nombre de sslip.io de tu servidor.
#   2. Elige el certificado: quita el # de las dos líneas ssl_certificate de una de las dos opciones
#      (la de Let's Encrypt o la de tu propia autoridad de certificación). nginx no arranca si
#      las dos están comentadas: sin certificado no hay HTTPS.

# Las copias de la API que nginx conoce: la del puerto 3000 y la del 3001 (docker compose up --scale
# api=2). Con una sola copia, el 3001 está vacío: nginx lo prueba, falla y lo deja de intentar
# durante fail_timeout. Es su comprobación pasiva: no pregunta si una copia vive, mira qué pasa
# con las peticiones de verdad. Con las dos caídas, el visitante recibe 502 (Bad Gateway).
upstream tienda {
    server 127.0.0.1:3000 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=1 fail_timeout=10s;
}

# Lo que pide una conexión que cambia a WebSocket (la ruta /eco): si el navegador manda Upgrade,
# nginx se lo pasa a la API; si no, no manda la cabecera Connection.
map $http_upgrade $conexion_cabecera {
    default upgrade;
    ''      '';
}

# Puerto 80: todo se redirige a HTTPS, salvo el reto con el que Let's Encrypt comprueba que el
# dominio es tuyo (certbot lo atiende; lección 5).
server {
    listen 80;
    listen [::]:80;
    server_name tienda.example;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Puerto 443: HTTPS, y la tienda detrás.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tienda.example;

    # Opción A, Let's Encrypt (certbot, lección 5): el certificado y su clave, en una carpeta con el
    # nombre del dominio.
    # ssl_certificate     /etc/letsencrypt/live/tienda.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tienda.example/privkey.pem;
    # Opción B, tu propia autoridad de certificación (openssl, lección 5): el certificado del
    # servidor, firmado por ella, y su clave.
    # ssl_certificate     /etc/ssl/tienda/tienda.crt;
    # ssl_certificate_key /etc/ssl/tienda/tienda.key;

    # Lo que la API necesita saber de quien pide, porque ella solo ve a nginx. Lo heredan todos los
    # location de abajo (si un location pone un proxy_set_header propio, deja de heredarlos).
    #   Host                la dirección que escribió el visitante
    #   X-Forwarded-For     la IP del visitante, añadida al final de lo que ya traía la cabecera:
    #                       la API lee la última entrada, la nuestra (PROXY_CONFIABLE)
    #   X-Forwarded-Proto   https: el visitante usó HTTPS, aunque a la API le llegue por http
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # HTTP/1.1 con la API, para las conexiones largas, y el cambio a WebSocket.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conexion_cabecera;

    location / {
        proxy_pass http://tienda;
    }

    # Los eventos de un pedido (Server-Sent Events): una respuesta que no termina, y que va dando
    # trozos. Dos cosas por las que el location propio:
    #   - proxy_buffering off: con el buffering (el valor por defecto), nginx guarda lo que la API
    #     manda hasta tener un bloque entero. Medido en la lección: con HTTP/1.1, el navegador no
    #     recibe ni el primer evento; con HTTP/2, nginx sí lo va soltando.
    #   - proxy_read_timeout 1h: si la API pasa 60 segundos sin enviar nada (el valor por defecto),
    #     nginx corta la conexión. Medido: a los 60 s exactos, un error de nginx en el log.
    location ~ ^/v2/pedidos/[^/]+/eventos$ {
        proxy_pass http://tienda;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
