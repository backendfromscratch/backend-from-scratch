# Checks the shop and publishes its image (Phase 8, lesson 6).
#   - On every pull request: install, type-check and run the tests. It publishes nothing.
#   - On every push to main (an accepted pull request): the same and, if everything passes, build
#     the image and publish it to ghcr.io/<your-user>/shop-api, with two tags: sha-<7 letters of the
#     commit> (this version, forever) and main (the latest).
# The server receives nothing from GitHub: it is the server that asks every two minutes whether main
# points to a new image (deployment/deploy.sh).
#
# GitHub only runs the workflows at the root of a repository. This one is inside the step's folder,
# so here it does nothing: copy the step's contents to the root of YOUR repository (with its
# .github/, its Dockerfile and its package.json next to it) and it switches on by itself.
name: Publish

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous check, which is no longer useful. On main
# nothing is cancelled: a half-done publication would leave main not knowing which image is the
# latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The minimum: by default, the workflow only reads the repository. A job that needs more (the one
# that publishes) asks for it in its own block.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The tests' database: PostgreSQL 18, the shop's version, pinned by its digest (the same one
    # compose.production.yaml uses). Its port is published on the runner only.
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      # Actions are pinned by the SHA of their commit, not by their tag: a tag can be moved to
      # malicious code (the tj-actions/changed-files attack, 2025) and a SHA cannot. The version
      # number goes in the comment. To keep them up to date, switch on Dependabot in your repository:
      # a .github/dependabot.yml with package-ecosystem: github-actions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes anything, so the token is not left in .git/config for other steps to read.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      # The role and the database the tests use (test/.env): the same ones the PostgreSQL lesson
      # asks you to create, with a password that is only good for tests.
      - name: role and database for the tests
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE shop LOGIN PASSWORD 'shop'" \
            -c "CREATE DATABASE shop_test OWNER shop"

      # npm ci installs exactly what package-lock.json says (and .npmrc runs no install scripts).
      # Every check runs even if the previous one failed, to see all the failures at once.
      - name: install
        id: install
        run: npm ci

      - name: types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check

      # The Redis store's tests skip themselves when there is no Redis: there isn't one here.
      - name: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

  publish:
    # Only after check passes, and only on main: a pull request never publishes.
    needs: check
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Here, and only here, the token can write packages (the image on ghcr.io).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ghcr.io only accepts lowercase in an image's name, and your username may have capitals. The
      # name goes through an environment variable, not written inside the script: that way what
      # comes from outside never turns into shell code.
      - name: image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/shop-api" >> "$GITHUB_OUTPUT"

      # QEMU and Buildx let it build the image for two architectures at once: amd64 (most servers)
      # and arm64 (Apple Silicon, Raspberry Pis and some servers).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Logs in to ghcr.io with the token GitHub gives this run: there is no password to create, and
      # the token stops working when the run ends.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the tags: sha-<7 letters of the commit> (this version) and main (the latest). No
      # latest: whoever deploys follows a branch, not "the last one that was uploaded".
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=raw,value=main

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
