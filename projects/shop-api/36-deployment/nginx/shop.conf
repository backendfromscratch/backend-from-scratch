# nginx in front of the shop (Phase 8, lesson 4). nginx listens on ports 80 and 443, the only ones
# the firewall lets through, and forwards what arrives to the API, which only listens on 127.0.0.1.
# Install it with:
#   sudo cp nginx/shop.conf /etc/nginx/sites-available/shop
#   sudo ln -s /etc/nginx/sites-available/shop /etc/nginx/sites-enabled/shop
#   sudo nginx -t && sudo systemctl reload nginx    (nginx -t checks the file first)
#
# Before installing it, change two things:
#   1. shop.example, in the two server_name lines, to your name: your domain or, with the free
#      path, your server's sslip.io name.
#   2. The certificate: as it is, it uses your own certificate authority's (free path, lesson 5),
#      copied to /etc/ssl/shop/. On the paid path, certbot --nginx replaces those two lines with
#      Let's Encrypt's (which are further down, commented out).

# The copies of the API nginx knows: the one on port 3000 and the one on 3001 (docker compose up
# --scale api=2). With a single copy, 3001 is empty: nginx tries it, it fails and it stops trying
# for fail_timeout. This is nginx's passive health check: it doesn't ask whether a copy is alive, it
# looks at what happens with the real requests. With both down, the visitor gets 502 (Bad Gateway).
upstream shop {
    server 127.0.0.1:3000 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=1 fail_timeout=10s;
}

# What a connection that switches to WebSocket asks for (the /echo route): if the browser sends
# Upgrade, nginx passes it to the API; if not, it doesn't send the Connection header.
map $http_upgrade $connection_header {
    default upgrade;
    ''      '';
}

# Port 80: everything is redirected to HTTPS, except the challenge Let's Encrypt uses to check that
# the domain is yours (certbot answers it; lesson 5).
server {
    listen 80;
    listen [::]:80;
    server_name shop.example;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: HTTPS, and the shop behind.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.example;

    # The server's certificate, signed by your own certificate authority (openssl, lesson 5), and
    # its key. That way it works without a domain: the browser warns because it doesn't know that
    # authority, and curl --cacert accepts it.
    ssl_certificate     /etc/ssl/shop/shop.crt;
    ssl_certificate_key /etc/ssl/shop/shop.key;
    # With a domain and Let's Encrypt, certbot --nginx replaces the two lines above with these (or
    # you replace them), with your domain's name in the folder:
    # ssl_certificate     /etc/letsencrypt/live/shop.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shop.example/privkey.pem;

    # What the API needs to know about whoever makes the request, because it only sees nginx. All
    # the locations below inherit them (if a location sets a proxy_set_header of its own, it stops
    # inheriting them).
    #   Host                the address the visitor typed
    #   X-Forwarded-For     what the header already carried (which the visitor could have written)
    #                       and, at the end, the visitor's IP, which nginx adds: the API reads the
    #                       last entry. It only trusts the header if the connection comes from
    #                       TRUSTED_PROXY, the address nginx talks to it from (with Docker, the
    #                       network's gateway), which isn't the visitor's
    #   X-Forwarded-Proto   https: the visitor used HTTPS, even if it reaches the API over http
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # HTTP/1.1 with the API, for long connections, and the switch to WebSocket.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_header;

    location / {
        proxy_pass http://shop;
    }

    # An order's events (Server-Sent Events): a response that never ends and arrives in chunks.
    # It gets its own location for two reasons:
    #   - proxy_buffering off: with buffering (the default), nginx keeps what the API sends until it
    #     has a whole block. Measured in the lesson: with HTTP/1.1, the browser doesn't receive even
    #     the first event; with HTTP/2, nginx does let them out little by little.
    #   - proxy_read_timeout 1h: if the API goes 60 seconds without sending anything (the default),
    #     nginx cuts the connection. Measured: at exactly 60 s, an nginx error in the log.
    location ~ ^/v2/orders/[^/]+/events$ {
        proxy_pass http://shop;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # The WebSocket echo (/echo): a connection that can go a long time without sending anything. With
    # the default 60 seconds, nginx would cut it; here, an hour.
    location = /echo {
        proxy_pass http://shop;
        proxy_read_timeout 1h;
    }
}
