# Where Grafana looks for its dashboards (Phase 10, lesson 5): the .json files in this folder, which
# Compose mounts from observability/grafana/dashboards/. The dashboards are files, not clicks: they
# are kept in Git, reviewed and created again on any computer.
apiVersion: 1

providers:
  - name: shop
    type: file
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
