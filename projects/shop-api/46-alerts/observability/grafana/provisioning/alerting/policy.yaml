# How Grafana shares the alerts among the contact points (Phase 10, lesson 6): the notification
# policy. There is only one here, the root: everything goes to "on-call" (contact.yaml).
#   group_by: alertname: each rule, in its own email. With the shop down, the three rules would
#     fire at once, and three emails with a clear subject read better than one with everything mixed.
#   group_wait: 10s: how long it waits before the first email of a group, in case another alert of
#     the same group arrives and they fit in one.
#   group_interval: 1m: how long it waits to report a change in a group that has already reported.
#   repeat_interval: 4h: if it stays the same, it reminds you every 4 hours, not every minute: an
#     alert that repeats nonstop ends up in an email filter (alert fatigue).
apiVersion: 1

policies:
  - orgId: 1
    receiver: on-call
    group_by: ['alertname']
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
