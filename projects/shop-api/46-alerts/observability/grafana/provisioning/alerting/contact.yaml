# Who Grafana tells (Phase 10, lesson 6): one contact point, "on-call", that sends an email to
# oncall@shop.example. The email goes out through the SMTP server in GF_SMTP_*
# (compose.observability.yaml): Mailpit, which sends it to nobody and shows it at
# http://localhost:8025. In a real team, this is where the email of whoever is on call would go, or
# a chat channel, or a service that phones them (Grafana can talk to many: type: slack, pagerduty,
# webhook…).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: on-call
    receivers:
      - uid: on-call-email
        type: email
        settings:
          addresses: oncall@shop.example
          # One email for all the addresses, not one per address.
          singleEmail: true
        # Also when it resolves: the "RESOLVED" email says it is over.
        disableResolveMessage: false
