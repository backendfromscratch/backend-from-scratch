# Jaeger 2's configuration (Phase 10, lesson 5). It is the one the image brings for trying it out
# (all in one: it receives, keeps in memory and shows), with a single difference: max_traces, the
# limit of traces it keeps in memory. Without a sensible limit, a load of thousands of requests per
# second (npm run load) fills the memory of Docker's virtual machine and the system kills Jaeger.
# With the limit, when it fills up, it throws away the oldest ones: the latest are always there.
# Why 5000: measured on 2026-10-24 with npm run load (261,000 requests in 35 s, one trace each),
# Jaeger reached 68 MiB, far below the 300 MiB it gets out of the virtual machine's 2 GiB, shared
# with the shop, PostgreSQL, Redis, Prometheus and Grafana. Without this limit, the same load filled
# it up and it was killed. If your traces are bigger, or you have more memory, raise the number.
extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_query:
    storage:
      traces: memory
    http:
      endpoint: 0.0.0.0:16686
  jaeger_storage:
    backends:
      memory:
        memory:
          max_traces: 5000

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memory

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
