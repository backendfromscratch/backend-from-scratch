# Where Grafana reads from (Phase 10, lesson 5): Prometheus, for the metrics. The traces aren't
# here: Grafana's connector for Jaeger asks the old API (/api/services) and Jaeger 2.22 only serves
# the new one (/api/v3), so it wouldn't work. The traces are looked at in Jaeger's web page, at
# http://127.0.0.1:16686. The uid is the name the dashboards use to refer to the source.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
