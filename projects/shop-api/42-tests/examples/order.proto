// The same order the API sends in JSON, described for Protobuf. Each field carries a number: the
// bytes carry that number, not the field's name.
syntax = "proto3";

package shop;

// An enum: in the bytes, the status is a small number, not a text like "pending".
enum Status {
  STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  PAID = 2;
  SHIPPED = 3;
  CANCELLED = 4;
}

message Order {
  uint32 id = 1;
  uint32 product_id = 2;
  uint32 quantity = 3;
  Status status = 4;
  string created_at = 5;
}
