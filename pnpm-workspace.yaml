packages:
  - web

# Supply chain (after the npm attacks of 2025, such as Shai-Hulud). pnpm 10 already runs no install
# scripts except the ones listed here.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

# A version has to be 7 days old (in minutes) before pnpm installs it: compromised versions are
# usually found and pulled within hours or days. Same wait as Dependabot's cooldown. An urgent
# security fix that is newer goes, with its exact version, in minimumReleaseAgeExclude.
minimumReleaseAge: 10080

# Refuses a version published with weaker guarantees than the previous ones (for example, without
# provenance), which is what a release with a stolen maintainer token looks like.
trustPolicy: no-downgrade
