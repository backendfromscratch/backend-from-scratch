# The form behind "Tell me on GitHub" at the end of each English lesson (web/src/lib/contact.ts).
# The site fills in the title and the "lesson" field; the ids must not change.
name: Something about a lesson
description: Something in a lesson is unclear, missing or wrong.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for writing. Every detail helps: you don't need to know backend to tell me.
  - type: input
    id: lesson
    attributes:
      label: Lesson
      description: The lesson's address. If you came from it, it's already there.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      description: What is unclear, missing or wrong. If it's a command, paste what you got.
    validations:
      required: true
