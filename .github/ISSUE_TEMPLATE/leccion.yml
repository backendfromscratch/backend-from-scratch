# The form behind «Cuéntamelo en GitHub» at the end of each Spanish lesson (web/src/lib/contact.ts).
# The site fills in the title and the «lesson» field; the ids must not change.
name: Algo de una lección
description: Algo no se entiende, falta o está mal en una lección.
body:
  - type: markdown
    attributes:
      value: |
        Gracias por escribir. Cualquier detalle ayuda: no hace falta saber backend para contarlo.
  - type: input
    id: lesson
    attributes:
      label: Lección
      description: La dirección de la lección. Si vienes desde ella, ya está puesta.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: ¿Qué pasa?
      description: Qué no se entiende, qué falta o qué está mal. Si es un comando, pega lo que te salió.
    validations:
      required: true
