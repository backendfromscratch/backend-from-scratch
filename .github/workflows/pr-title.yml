# PRs are squash-merged and the squashed commit takes the PR title, so the title is the commit
# message that lands on main. This job checks it follows Conventional Commits.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-commit:
    name: conventional commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      # The title goes through an environment variable, never interpolated into the script:
      # anyone opening a PR chooses it, and `${{ }}` inside `run` would execute it as shell.
      - name: check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z0-9`].*[^.]$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::The PR title must follow Conventional Commits: 'type(optional-scope): summary', in lowercase, without a final period. Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert. Example: 'feat(phase-1): add the ssh lesson'. Got: '$TITLE'"
            exit 1
          fi
