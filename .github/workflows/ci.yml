# Checks every change with the same commands as "Before calling a task done" (CLAUDE.md).
# It does not deploy: Cloudflare's Git integration (Workers Builds) does that. Phase 8 kept it
# that way, with no Cloudflare token in GitHub; its CI/CD lesson explains why.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Once a week, everything, even if nothing changed: what changes outside the repository (a new
  # Node 26 release, a package removed from npm) shows up here, not in the next unrelated PR.
  schedule:
    - cron: '17 5 * * 1'

# A new push to the same branch or PR cancels the previous run, which is no longer useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

jobs:
  checks:
    name: format, types, tests and build
    runs-on: ubuntu-24.04
    # 150 pages and their accessibility checks in two themes: more than 10 minutes since Phase 6.
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit SHA, not by tag: a tag can be moved to malicious code (the
      # tj-actions/changed-files attack, 2025) and a SHA cannot. Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so the token is not left in .git/config for later steps to read.
          persist-credentials: false

      # Installs the pnpm version pinned in `packageManager` (package.json).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: install
        name: install dependencies
        run: pnpm install --frozen-lockfile

      # Each check runs even if the previous one failed, to see every failure at once.
      - name: format (prettier)
        run: pnpm format:check

      # Common workflow mistakes: unpinned actions, persisted credentials, expressions injected
      # into shell scripts… The token lets it check the pinned SHAs against GitHub.
      - name: workflows (zizmor)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.30.1 --format=github .

      # The Terraform files readers download in Phase 8 (web/public/practicas/terraform/, one folder
      # per language): formatted, and valid for the pinned provider. `init -backend=false` only
      # downloads the provider (no state, no cloud account); validate then checks the file without
      # touching Docker. It runs on a copy so the container does not leave a root-owned .terraform in
      # the checkout. No lock file is shipped with the practice, so the provider's checksums come
      # from the exact version pin in main.tf. Pinned by digest, like the Actions.
      - name: terraform practice files (fmt and validate)
        if: ${{ !cancelled() }}
        env:
          TERRAFORM_IMAGE: hashicorp/terraform:1.16.6@sha256:bfffc1ded5fbf0a17beaaf22eb4793980abdb19d0761ff6a3a0efb2ab4d9b316 # 1.16.6
        run: |
          failed=""
          for dir in web/public/practicas/terraform/*/; do
            echo "::group::terraform $dir"
            work="$(mktemp -d)"
            cp "$dir"*.tf "$work/"
            if ! docker run --rm -v "$work":/tf -w /tf "$TERRAFORM_IMAGE" fmt -check -diff ||
              ! docker run --rm -v "$work":/tf -w /tf "$TERRAFORM_IMAGE" init -backend=false -input=false ||
              ! docker run --rm -v "$work":/tf -w /tf "$TERRAFORM_IMAGE" validate; then
              failed="$failed $dir"
            fi
            # The paid server example (servidor.tf.ejemplo / server.tf.example) is not a .tf file, so
            # the lesson's reader doesn't apply it by accident. Here it is validated as main.tf, in a
            # folder of its own: it needs the hcloud and cloudflare providers, which init downloads.
            for example in "$dir"servidor.tf.ejemplo "$dir"server.tf.example; do
              [ -f "$example" ] || continue
              paid="$(mktemp -d)"
              cp "$example" "$paid/main.tf"
              if ! docker run --rm -v "$paid":/tf -w /tf "$TERRAFORM_IMAGE" fmt -check -diff ||
                ! docker run --rm -v "$paid":/tf -w /tf "$TERRAFORM_IMAGE" init -backend=false -input=false ||
                ! docker run --rm -v "$paid":/tf -w /tf "$TERRAFORM_IMAGE" validate; then
                failed="$failed ${example}"
              fi
            done
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::These Terraform folders failed:$failed"
            exit 1
          fi

      # The replica practice of Phase 9 (web/public/practicas/replicas/, one folder per language) is a
      # Compose file: `config --quiet` checks that it parses and that its services and networks are
      # consistent, without pulling images or starting anything.
      - name: replica practice files (docker compose config)
        if: ${{ !cancelled() }}
        run: |
          for dir in web/public/practicas/replicas/*/; do
            docker compose -f "$dir"compose.yaml config --quiet
          done

      - name: types (astro check)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check

      - name: unused code and dependencies (knip)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm knip

      - name: tests (vitest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - id: build
        name: build (links, diagrams and SEO audit)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      # Accessibility (axe-core) on the built site: every page and the labs' states, in dark and
      # light. Only Chromium, with the system libraries it needs.
      - name: install the browser (playwright)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: accessibility (axe-core with playwright)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:e2e

  # The guided projects of the course (projects/), each step a complete Node.js project: the same
  # Node version the lessons ask for, and npm, the package manager the reader uses. A step's code
  # is shown in the lessons, so a step that fails to install, type-check or pass its tests is a
  # broken lesson. A pull request checks only the steps it changes (each step is a project of its
  # own: no step reads another's files), so a PR that does not touch projects/ passes in seconds;
  # pushes to main, manual runs and the weekly run check every step.
  projects:
    name: guided projects (node 26)
    runs-on: ubuntu-24.04
    # Every step: from 13 to 21 minutes since Phase 7 (each step also runs the tests of the earlier
    # ones, one file at a time because they share the test database). With Phase 8 a full run took
    # 29m16s (2026-10-17), about 25 minutes of it the install-and-tests step, and each new step adds
    # its own tests to that. Phase 9 adds five steps in each language, with Compose (a worker, Mailpit
    # and a queue check each): about 41 to 47 minutes estimated for all of them, so 60 leaves room.
    timeout-minutes: 60
    # From Phase 5 the steps keep their data in PostgreSQL 18, the version the lessons install, and
    # from Phase 7 the rate limiter's Redis store is tested against Redis 8. Pinned by digest, like
    # the Actions. Their ports are published on the runner only.
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:8@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6 # 8
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit with main: its first parent is main,
          # so the diff against it is exactly what the PR changes.
          fetch-depth: 2

      # The steps to check, one per line, in $RUNNER_TEMP/steps. In a pull request, the step
      # folders it changes that still exist, or every step if it changes this workflow.
      - name: steps to check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          all() { printf '%s\n' projects/*/[0-9][0-9]-*/; }
          if [ "$EVENT" != pull_request ]; then
            all
          else
            # Without rename detection, a file moved from one step to another names both steps.
            changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
            if printf '%s\n' "$changed" | grep -qx '.github/workflows/ci.yml'; then
              all
            else
              # grep finds nothing in a PR that does not touch projects/: not an error.
              printf '%s\n' "$changed" | { grep -oE '^projects/[^/]+/[0-9][0-9]-[^/]+/' || true; } |
                sort -u | while IFS= read -r step; do if [ -d "$step" ]; then echo "$step"; fi; done
            fi
          fi > "$RUNNER_TEMP/steps"
          echo "Steps to check: $(grep -c . "$RUNNER_TEMP/steps" || true)"
          cat "$RUNNER_TEMP/steps"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: projects/*/*/package-lock.json

      # The role and the test database each project's steps use (test/.env): the same the
      # lessons ask the reader to create, with a password that is only for tests.
      - name: database roles for the tests
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE tienda LOGIN PASSWORD 'tienda'" -c "CREATE DATABASE tienda_test OWNER tienda" \
            -c "CREATE ROLE shop LOGIN PASSWORD 'shop'" -c "CREATE DATABASE shop_test OWNER shop"

      # Every step, even after one fails, so the log shows all the failures at once. `npm ci`
      # installs exactly the lockfile, and each step's .npmrc turns off install scripts. The Redis
      # store's tests use database 1 of the Redis service (without the variable they are skipped).
      # The loops read the list on descriptor 3: on standard input, npm or docker could eat the rest
      # of it and skip steps without a word.
      - name: install, types and tests of every step
        env:
          REDIS_URL_TESTS: redis://127.0.0.1:6379/1
        run: |
          failed=""
          while IFS= read -r step <&3; do
            echo "::group::$step"
            if ! (cd "$step" && npm ci && { [ "$(npm pkg get scripts.check)" = "{}" ] || npm run check; } && npm test); then
              failed="$failed $step"
            fi
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/steps"
          if [ -n "$failed" ]; then
            echo "::error::These steps failed:$failed"
            exit 1
          fi

      # From Phase 7: every step with a Dockerfile builds its image, as the lessons do; and the
      # Docker Compose step brings up the whole shop (API, PostgreSQL and Redis; from Phase 9 also the
      # worker, Mailpit and the cache), answers on its published port and, where there is a
      # Mailpit, checks that a queued email survives a Redis restart (queued_email_survives_redis),
      # and is removed with its data. Its .env is the step's example (.env.ejemplo or
      # .env.example) with new random secrets, as the README asks the reader to do. The two
      # languages' Compose projects publish the same ports, so they run one after the other.
      - name: docker images and docker compose
        if: ${{ !cancelled() }}
        run: |
          failed=""
          while IFS= read -r step <&3; do
            [ -f "$step/Dockerfile" ] || continue
            echo "::group::docker build $step"
            docker build "$step" || failed="$failed $step"
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/steps"
          # From Phase 9, a paid order queues an email that a worker sends through Mailpit. The
          # promise of the queue: with the worker stopped the job waits, Redis restarts (its
          # append-only file brings the queue back; from the outbox step the job is also in
          # PostgreSQL), the worker comes back and the email still arrives. Order 21 is the first
          # pending one of the practice data, and the gateway script signs the real webhook.
          queued_email_survives_redis() {
            (
              cd "$1" || exit 1
              # Mailpit has no healthcheck: up --wait returns when its container runs, so wait for its
              # port to answer. It must start empty, or the wait below could pass on a message that
              # is not ours.
              inbox=""
              for _ in $(seq 30); do
                inbox="$(curl --silent --fail --max-time 5 http://127.0.0.1:8025/api/v1/messages)" && break
                sleep 1
              done
              [ -n "$inbox" ] || { echo "Mailpit did not answer on port 8025 after 30 seconds"; exit 1; }
              printf '%s' "$inbox" | grep -Eq '"total": *0' || {
                echo "Mailpit was not empty before paying the order"
                exit 1
              }
              docker compose stop "$worker" &&
                PORT="${2##*:}" npm run --silent "$gateway" -- 21 | tee /dev/stderr | grep -q '← 2' &&
                docker compose restart redis &&
                docker compose start "$worker" || exit 1
              for _ in $(seq 30); do
                curl --silent --fail --max-time 5 http://127.0.0.1:8025/api/v1/messages | grep -Eq '"total": *[1-9]' && exit 0
                sleep 1
              done
              echo "No email in Mailpit after 30 seconds"
              exit 1
            )
          }
          while IFS= read -r step <&3; do
            [ -f "$step/compose.yaml" ] || continue
            echo "::group::docker compose $step"
            for example in "$step/.env.ejemplo" "$step/.env.example"; do
              [ -f "$example" ] && break
            done
            while IFS= read -r line; do
              case "$line" in
                [!#]*SECRET*=* | [!#]*PASSWORD*=*) echo "${line%%=*}=$(openssl rand -hex 32)" ;;
                *) echo "$line" ;;
              esac
            done < "$example" > "$step/.env"
            case "$step" in
              projects/tienda-api/*) route=salud worker=trabajador gateway=pasarela ;;
              *) route=health worker=worker gateway=gateway ;;
            esac
            # The API publishes a range of ports (one per copy): ask Compose which one it took.
            if ! (cd "$step" && docker compose up --build --wait --wait-timeout 180) ||
              ! address="$(cd "$step" && docker compose port api 3000)" ||
              ! curl --fail --silent --show-error "http://$address/$route" ||
              { grep -q '^  mailpit:' "$step/compose.yaml" && ! queued_email_survives_redis "$step" "$address"; }; then
              (cd "$step" && docker compose logs)
              failed="$failed $step"
            fi
            (cd "$step" && docker compose down -v)
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/steps"
          if [ -n "$failed" ]; then
            echo "::error::These steps failed:$failed"
            exit 1
          fi

      # From Phase 8: the production files of the steps that have them (step 35 onwards), which no
      # test runs because they only work on a server. Each is checked with the tool that would
      # reject it there, in a container pinned by digest (no third-party Action):
      #   - docker compose config: the production Compose file is valid with an .env made from the
      #     step's example (secrets replaced, as the README asks the reader to do);
      #   - nginx -t: the site file loads in nginx 1.28 (Ubuntu 26.04's major version), inside the
      #     http { } block the real nginx.conf puts it in, with a throwaway certificate at the paths
      #     the file names;
      #   - shellcheck: the deployment and backup scripts;
      #   - systemd-analyze verify: the units, in Ubuntu 26.04 with systemd installed. The step is
      #     mounted where the units expect it (/opt/<name>) and docker.service is an empty stub, so
      #     only real mistakes (unknown keys, missing files, scripts that are not executable) fail;
      #   - actionlint: the step's own workflow. zizmor needs no line here: the "workflows (zizmor)"
      #     step of the first job already scans projects/**/.github/workflows/ (checked in Phase 8).
      # Every step, even after one fails; every check, even after one fails in the same step.
      - name: production files (compose, nginx, shellcheck, systemd, actionlint)
        if: ${{ !cancelled() }}
        env:
          NGINX_IMAGE: nginx:1.28@sha256:146adea4768b83c607d0bdfa4188464e3da6e0a3ad4475db1d1d8f64f27c29cc # 1.28.3
          SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d # v0.11.0
          ACTIONLINT_IMAGE: rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
          UBUNTU_IMAGE: ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944 # 26.04
        run: |
          failed=""
          try() {
            name="$1"; shift
            "$@" || { echo "::error::$step: $name failed"; bad=1; }
          }
          # The throwaway .env never stays in a step, even if the script stops halfway.
          trap '[ -z "${step-}" ] || rm -f "$step/.env"' EXIT
          while IFS= read -r step <&3; do
            step="${step%/}"
            for compose in "$step"/compose.produc*.yaml; do [ -f "$compose" ] && break; done
            [ -f "$compose" ] || continue
            echo "::group::production files $step"
            bad=""
            work="$(mktemp -d)"

            # An .env like the Compose step's: the example with new random secrets.
            for example in "$step"/.env.produccion.ejemplo "$step"/.env.production.example; do
              [ -f "$example" ] && break
            done
            if [ -f "$example" ]; then
              while IFS= read -r line; do
                case "$line" in
                  [!#]*SECRET*=* | [!#]*PASSWORD*=*) echo "${line%%=*}=$(openssl rand -hex 32)" ;;
                  *) echo "$line" ;;
                esac
              done < "$example" > "$step/.env"
              try "docker compose config" docker compose --project-directory "$step" -f "$compose" config --quiet
            else
              echo "skipped docker compose config: no .env.produc* example"
            fi

            # nginx: the first (active) certificate and key paths of the file, a throwaway pair there.
            for conf in "$step"/nginx/*.conf; do [ -f "$conf" ] && break; done
            if [ -f "$conf" ]; then
              crt="$(sed -n 's/^ *ssl_certificate  *\(\/[^;]*\);.*/\1/p' "$conf" | head -n 1)"
              key="$(sed -n 's/^ *ssl_certificate_key  *\(\/[^;]*\);.*/\1/p' "$conf" | head -n 1)"
              mkdir -p "$work/certs"
              openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=example.test \
                -keyout "$work/certs/key.pem" -out "$work/certs/crt.pem" 2> /dev/null
              printf 'events {}\nhttp {\n    include /etc/nginx/site-under-test.conf;\n}\n' > "$work/nginx.conf"
              try "nginx -t" docker run --rm \
                -v "$PWD/$conf":/etc/nginx/site-under-test.conf:ro \
                -v "$work/nginx.conf":/etc/nginx/test.conf:ro \
                -v "$work/certs/crt.pem":"$crt":ro -v "$work/certs/key.pem":"$key":ro \
                "$NGINX_IMAGE" nginx -t -c /etc/nginx/test.conf
            else
              echo "skipped nginx -t: no nginx/*.conf"
            fi

            # The scripts next to the units' folder (deployment/ or despliegue/).
            scripts=()
            for script in "$step"/deployment/*.sh "$step"/despliegue/*.sh; do
              [ -f "$script" ] && scripts+=("${script#"$step"/}")
            done
            if [ "${#scripts[@]}" -gt 0 ]; then
              try "shellcheck" docker run --rm -v "$PWD/$step":/step:ro -w /step "$SHELLCHECK_IMAGE" \
                "${scripts[@]}"
            else
              echo "skipped shellcheck: no deployment scripts"
            fi

            # systemd: the units sit in a folder of the step; their paths start with /opt/<name>.
            units=()
            for unit in "$step"/*/*.service "$step"/*/*.timer; do
              [ -f "$unit" ] && units+=("${unit#"$step"/}")
            done
            if [ "${#units[@]}" -gt 0 ]; then
              opt="$(grep -ho '/opt/[a-z-]*' "$step/${units[0]}" | head -n 1)"
              # apt installs whatever systemd Ubuntu 26.04 ships on the day (not pinned): only the
              # syntax of the units is checked, so a newer systemd cannot hide a real mistake and
              # pinning a package version would break the job every time Ubuntu updates it.
              # The units go as arguments; "$@" is expanded by the container's shell, on purpose.
              # shellcheck disable=SC2016
              try "systemd-analyze verify" docker run --rm -v "$PWD/$step":"$opt":ro \
                -e DEBIAN_FRONTEND=noninteractive -w "$opt" "$UBUNTU_IMAGE" sh -ec '
                  apt-get update -qq > /dev/null
                  apt-get install -y -qq --no-install-recommends systemd > /dev/null
                  printf "[Service]\nExecStart=/bin/true\n" > /etc/systemd/system/docker.service
                  systemd-analyze verify --man=no "$@"' sh "${units[@]}"
            else
              echo "skipped systemd-analyze verify: no units"
            fi

            for workflow in "$step"/.github/workflows/*.yml; do
              [ -f "$workflow" ] || continue
              try "actionlint" docker run --rm -v "$PWD/$step":/step:ro -w /step "$ACTIONLINT_IMAGE" \
                -color=false "${workflow#"$step"/}"
            done

            rm -f "$step/.env"
            [ -z "$bad" ] || failed="$failed $step"
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/steps"
          if [ -n "$failed" ]; then
            echo "::error::These steps failed:$failed"
            exit 1
          fi
