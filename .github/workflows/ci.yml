# Checks every change with the same commands as "Before calling a task done" (CLAUDE.md).
# It does not deploy: Cloudflare's Git integration does that (deploying from GitHub Actions
# comes in Phase 8).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or PR cancels the previous run, which is no longer useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

jobs:
  checks:
    name: format, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in `packageManager` (package.json).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: install
        name: install dependencies
        run: pnpm install --frozen-lockfile

      # Each check runs even if the previous one failed, to see every failure at once.
      - name: format (prettier)
        run: pnpm format:check

      - name: types (astro check)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check

      - name: tests (vitest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: build (links, diagrams and SEO audit)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
