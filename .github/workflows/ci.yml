# Checks every change with the same commands as "Before calling a task done" (CLAUDE.md).
# It does not deploy: Cloudflare's Git integration does that (deploying from GitHub Actions
# comes in Phase 8).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Once a week, everything, even if nothing changed: what changes outside the repository (a new
  # Node 26 release, a package removed from npm) shows up here, not in the next unrelated PR.
  schedule:
    - cron: '17 5 * * 1'

# A new push to the same branch or PR cancels the previous run, which is no longer useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

jobs:
  checks:
    name: format, types, tests and build
    runs-on: ubuntu-24.04
    # 150 pages and their accessibility checks in two themes: more than 10 minutes since Phase 6.
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit SHA, not by tag: a tag can be moved to malicious code (the
      # tj-actions/changed-files attack, 2025) and a SHA cannot. Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so the token is not left in .git/config for later steps to read.
          persist-credentials: false

      # Installs the pnpm version pinned in `packageManager` (package.json).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: install
        name: install dependencies
        run: pnpm install --frozen-lockfile

      # Each check runs even if the previous one failed, to see every failure at once.
      - name: format (prettier)
        run: pnpm format:check

      # Common workflow mistakes: unpinned actions, persisted credentials, expressions injected
      # into shell scripts… The token lets it check the pinned SHAs against GitHub.
      - name: workflows (zizmor)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.30.1 --format=github .

      - name: types (astro check)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check

      - name: unused code and dependencies (knip)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm knip

      - name: tests (vitest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - id: build
        name: build (links, diagrams and SEO audit)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      # Accessibility (axe-core) on the built site: every page and the labs' states, in dark and
      # light. Only Chromium, with the system libraries it needs.
      - name: install the browser (playwright)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: accessibility (axe-core with playwright)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:e2e

  # The guided projects of the course (projects/), each step a complete Node.js project: the same
  # Node version the lessons ask for, and npm, the package manager the reader uses. A step's code
  # is shown in the lessons, so a step that fails to install, type-check or pass its tests is a
  # broken lesson. A pull request checks only the steps it changes (each step is a project of its
  # own: no step reads another's files), so a PR that does not touch projects/ passes in seconds;
  # pushes to main, manual runs and the weekly run check every step.
  projects:
    name: guided projects (node 26)
    runs-on: ubuntu-24.04
    # Every step: from 13 to 21 minutes since Phase 7 (each step also runs the tests of the earlier
    # ones, one file at a time because they share the test database).
    timeout-minutes: 30
    # From Phase 5 the steps keep their data in PostgreSQL 18, the version the lessons install, and
    # from Phase 7 the rate limiter's Redis store is tested against Redis 8. Pinned by digest, like
    # the Actions. Their ports are published on the runner only.
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:8@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6 # 8
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request is checked out as its merge commit with main: its first parent is main,
          # so the diff against it is exactly what the PR changes.
          fetch-depth: 2

      # The steps to check, one per line, in $RUNNER_TEMP/steps. In a pull request, the step
      # folders it changes that still exist, or every step if it changes this workflow.
      - name: steps to check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          all() { printf '%s\n' projects/*/[0-9][0-9]-*/; }
          if [ "$EVENT" != pull_request ]; then
            all
          else
            # Without rename detection, a file moved from one step to another names both steps.
            changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
            if printf '%s\n' "$changed" | grep -qx '.github/workflows/ci.yml'; then
              all
            else
              # grep finds nothing in a PR that does not touch projects/: not an error.
              printf '%s\n' "$changed" | { grep -oE '^projects/[^/]+/[0-9][0-9]-[^/]+/' || true; } |
                sort -u | while IFS= read -r step; do if [ -d "$step" ]; then echo "$step"; fi; done
            fi
          fi > "$RUNNER_TEMP/steps"
          echo "Steps to check: $(grep -c . "$RUNNER_TEMP/steps" || true)"
          cat "$RUNNER_TEMP/steps"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: projects/*/*/package-lock.json

      # The role and the test database each project's steps use (test/.env): the same the
      # lessons ask the reader to create, with a password that is only for tests.
      - name: database roles for the tests
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE tienda LOGIN PASSWORD 'tienda'" -c "CREATE DATABASE tienda_test OWNER tienda" \
            -c "CREATE ROLE shop LOGIN PASSWORD 'shop'" -c "CREATE DATABASE shop_test OWNER shop"

      # Every step, even after one fails, so the log shows all the failures at once. `npm ci`
      # installs exactly the lockfile, and each step's .npmrc turns off install scripts. The Redis
      # store's tests use database 1 of the Redis service (without the variable they are skipped).
      # The loops read the list on descriptor 3: on standard input, npm or docker could eat the rest
      # of it and skip steps without a word.
      - name: install, types and tests of every step
        env:
          REDIS_URL_TESTS: redis://127.0.0.1:6379/1
        run: |
          failed=""
          while IFS= read -r step <&3; do
            echo "::group::$step"
            if ! (cd "$step" && npm ci && { [ "$(npm pkg get scripts.check)" = "{}" ] || npm run check; } && npm test); then
              failed="$failed $step"
            fi
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/steps"
          if [ -n "$failed" ]; then
            echo "::error::These steps failed:$failed"
            exit 1
          fi

      # From Phase 7: every step with a Dockerfile builds its image, as the lessons do; and the
      # Docker Compose step brings up the whole shop (API, PostgreSQL and Redis), answers on its
      # published port and is removed with its data. Its .env is the step's example (.env.ejemplo or
      # .env.example) with new random secrets, as the README asks the reader to do. The two
      # languages' Compose projects publish the same ports, so they run one after the other.
      - name: docker images and docker compose
        if: ${{ !cancelled() }}
        run: |
          failed=""
          while IFS= read -r step <&3; do
            [ -f "$step/Dockerfile" ] || continue
            echo "::group::docker build $step"
            docker build "$step" || failed="$failed $step"
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/steps"
          while IFS= read -r step <&3; do
            [ -f "$step/compose.yaml" ] || continue
            echo "::group::docker compose $step"
            for example in "$step/.env.ejemplo" "$step/.env.example"; do
              [ -f "$example" ] && break
            done
            while IFS= read -r line; do
              case "$line" in
                [!#]*SECRET*=* | [!#]*PASSWORD*=*) echo "${line%%=*}=$(openssl rand -hex 32)" ;;
                *) echo "$line" ;;
              esac
            done < "$example" > "$step/.env"
            case "$step" in
              projects/tienda-api/*) route=salud ;;
              *) route=health ;;
            esac
            # The API publishes a range of ports (one per copy): ask Compose which one it took.
            if ! (cd "$step" && docker compose up --build --wait --wait-timeout 180) ||
              ! address="$(cd "$step" && docker compose port api 3000)" ||
              ! curl --fail --silent --show-error "http://$address/$route"; then
              (cd "$step" && docker compose logs)
              failed="$failed $step"
            fi
            (cd "$step" && docker compose down -v)
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/steps"
          if [ -n "$failed" ]; then
            echo "::error::These steps failed:$failed"
            exit 1
          fi
