# Weekly updates in a few grouped PRs. The titles follow Conventional Commits ("build(deps): bump…"
# and "ci(deps): bump…"), which the "PR title" check asks for.
version: 2
updates:
  - package-ecosystem: npm # it reads pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Same wait as minimumReleaseAge (pnpm-workspace.yaml): otherwise Dependabot would propose
    # versions pnpm refuses to install. Security updates do not wait.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # Minor and patch versions together; each major one comes in its own PR, since it can break things.
      dependencies:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
