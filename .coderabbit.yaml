# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews every PR. Docstrings are off: the code comments only what is not obvious,
# so a coverage threshold would push for noise.
reviews:
  pre_merge_checks:
    docstrings:
      # Quoted: in YAML 1.1 a bare `off` is the boolean false, not the string "off".
      mode: 'off'
  finishing_touches:
    docstrings:
      enabled: false
